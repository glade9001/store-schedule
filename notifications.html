<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>🔔 通知紀錄</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="firebase-init.js"></script>
<style>
:root { --primary:#1a73e8; --text:#1f2937; --muted:#64748b; --border:#e2e8f0; --bg:#f4f6fa; --danger:#d93025; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif; }
.nf-head { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; background:#0e2140; color:#fff; padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px; }
.nf-head h1 { margin:0; flex:1; font-size:17px; font-weight:900; }
.nf-head button { font:inherit; color:#fff; background:none; border:0; min-height:44px; min-width:44px; font-size:14px; font-weight:800; cursor:pointer; }
.nf-list { max-width:640px; margin:0 auto; padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px)); display:grid; gap:8px; }
.nf-item { display:grid; grid-template-columns:10px 1fr; gap:10px; width:100%; text-align:left; font:inherit; color:inherit; background:#fff; border:1px solid var(--border); border-radius:12px; padding:12px; cursor:pointer; }
.nf-dot { width:9px; height:9px; margin-top:5px; border-radius:50%; background:transparent; }
.nf-item.unread .nf-dot { background:var(--danger); }
.nf-item b { display:block; font-size:14.5px; line-height:1.4; }
.nf-item span.t { display:block; margin-top:3px; font-size:13px; line-height:1.55; color:#475569; white-space:pre-line; word-break:break-word; }
.nf-item small { display:block; margin-top:5px; font-size:11.5px; color:var(--muted); }
.nf-empty { text-align:center; padding:48px 16px; color:var(--muted); font-size:14px; line-height:1.8; }
.nf-more { font:inherit; font-size:14px; font-weight:800; color:var(--primary); background:none; border:0; min-height:44px; cursor:pointer; }
</style>
</head>
<body>
<div class="nf-head">
  <button type="button" onclick="location.href='home.html'" aria-label="回首頁">‹ 首頁</button>
  <h1>🔔 通知紀錄</h1>
  <button type="button" id="nfAll" hidden>全部已讀</button>
</div>
<div class="nf-list" id="nfList"><div class="nf-empty">讀取中…</div></div>
<script src="notifications-page.js"></script>
</body>
</html>

name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只有一個部署，新部署自動取消進行中的（最新為準，避免殭屍 run 卡住並發鎖堵塞後續）
concurrency:
  group: pages
  cancel-in-progress: true

# ⚠️ 2026-11-25：原本「上傳」和「發布」擠在同一個 job 連續跑，GitHub 剛上傳的 artifact 幾秒內還查不到
#    （log：上傳成功、Artifact ID 有了，下一步卻「Found 0 artifact(s)」→ No artifacts named "github-pages"）。
#    當天 12 次有 8 次第一次失敗、重跑全過。改成官方範本的 build / deploy 兩個 job，
#    再加「失敗等 30 秒重試一次」，不用再手動 rerun。
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact (整個 repo 根目錄，.nojekyll 已停用 Jekyll)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: 失敗時等 30 秒（artifact 同步延遲）
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages（重試）
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

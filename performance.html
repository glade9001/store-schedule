<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="莉學商行">
<link rel="apple-touch-icon" href="icon-192.svg">
<meta name="theme-color" content="#e67e22">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📊 經營績效專區</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="firebase-init.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--primary:#e67e22;--primary-dark:#c0620f;--accent:#34a853;--danger:#d93025;--warn:#f9ab00;
  --bg:#f4f6fb;--text:#1e293b;--text-muted:#64748b;--border:#e2e8f0;--header-h:56px;--radius:14px;}
html,body{height:100%;background:var(--bg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text);}
#loadingOverlay{display:flex;position:fixed;inset:0;background:linear-gradient(135deg,#e67e22,#c0620f);z-index:99999;flex-direction:column;justify-content:center;align-items:center;color:#fff;transition:opacity .4s;}
#loadingOverlay.hidden{opacity:0;pointer-events:none;}
.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:0 14px;height:var(--header-h);display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px rgba(230,126,34,.3);position:sticky;top:0;z-index:100;}
.header-back{background:rgba(255,255,255,.18);border:none;color:#fff;height:34px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;padding:0 12px;white-space:nowrap;}
.header-title{font-size:17px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.header-store{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:5px 8px;font-size:13px;font-weight:700;max-width:130px;}
.header-store option{color:#000;}
.content{padding:14px 12px 90px;max-width:640px;margin:0 auto;}
.note{background:#fff8ee;border:1px solid #ffd8a8;border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.7;color:#8a5a1a;margin-bottom:14px;}
.sec-title{font-size:12px;font-weight:800;color:var(--text-muted);letter-spacing:.5px;margin:16px 4px 8px;}
.mon-card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:13px 15px;margin-bottom:9px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .1s;}
.mon-card:active{transform:scale(.99);}
.mon-title{font-size:15px;font-weight:800;flex:1;}
.mon-badge{font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap;}
.b-done{background:#e6f4ea;color:#137333;}
.b-todo{background:#fce8e6;color:#c5221f;}
.mon-arrow{color:#ccc;font-size:16px;}
.empty{text-align:center;padding:30px 20px;color:var(--text-muted);}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;display:none;align-items:flex-end;justify-content:center;}
.overlay.show{display:flex;}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px 28px;}
.sheet-handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 14px;}
.sheet-title{font-size:18px;font-weight:900;margin-bottom:4px;}
.sheet-sub{font-size:12px;color:var(--text-muted);margin-bottom:16px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px;}
.field input[type=number]{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;font-weight:700;}
.field .unit{font-size:12px;color:var(--text-muted);font-weight:400;}
.chk-row{display:flex;gap:16px;margin-top:8px;}
.chk-row label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;cursor:pointer;}
.chk-row input{width:17px;height:17px;}
.btn-primary{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;margin-top:6px;}
.btn-cancel{width:100%;padding:12px;background:#f1f3f4;color:var(--text);border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;}
/* comparison */
.cmp{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:16px;margin-top:14px;}
.cmp-title{font-size:16px;font-weight:900;margin-bottom:12px;text-align:center;}
.cmp-row{padding:9px 0;border-bottom:1px dashed var(--border);}
.cmp-row:last-child{border-bottom:none;}
.cmp-metric{font-size:15px;font-weight:800;}
.cmp-delta{font-size:12.5px;margin-top:2px;}
.up{color:#137333;} .down{color:#c5221f;} .neu{color:var(--text-muted);}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:11px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:99999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
#toast.show{opacity:1;}
</style>
</head>
<body>
<div id="loadingOverlay"><div class="spinner"></div><div id="loadingText">載入中…</div></div>

<div class="header">
  <button class="header-back" onclick="window.location.href='home.html'">← 首頁</button>
  <div class="header-title">📊 經營績效專區</div>
  <select class="header-store" id="storeSel" onchange="onStoreChange()" style="display:none;"></select>
</div>

<div class="content">
  <div class="note">
    📅 公司每月 <b>4–7 號</b>寄門市損益表，請於 <b>10 號前</b>輸入「上一個月」的數據（例：7 月輸入 6 月）。<br>
    首次請從 <b>2025 年 7 月</b>起補齊；輸入完成後會與<b>去年同期</b>比較，並自動通知全體店長與加盟主。
  </div>
  <div id="listWrap"></div>
</div>

<!-- 輸入 sheet -->
<div class="overlay" id="editOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div style="display:flex;align-items:flex-start;gap:8px;">
      <div class="sheet-title" id="editTitle" style="flex:1;">輸入損益</div>
      <button id="editBtn" onclick="switchToEdit()" style="display:none;background:#fff3e0;color:#c0620f;border:1.5px solid #e67e22;border-radius:9px;padding:6px 12px;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap;">✏️ 編輯</button>
    </div>
    <div class="sheet-sub" id="editSub"></div>
    <div id="formSection">
    <div class="field"><label>營業淨額 <span class="unit">元</span></label><input type="number" id="fNetSales" inputmode="numeric"></div>
    <div class="field"><label>毛利率 <span class="unit">% （例：29.32）</span></label><input type="number" id="fGross" step="0.01" inputmode="decimal"></div>
    <div class="field"><label>壞品（成本）<span class="unit">元</span></label><input type="number" id="fBad" inputmode="numeric"></div>
    <div class="field"><label>壞品補貼 <span class="unit">元（含在經營報酬內）</span></label><input type="number" id="fSubsidy" inputmode="numeric"></div>
    <div class="field">
      <label>盤點損益 <span class="unit">元（盤損填負數，如 -7751）</span></label>
      <input type="number" id="fInv" inputmode="numeric">
      <div class="chk-row">
        <label><input type="checkbox" id="fInvGain" onchange="onInvToggle()"> 本月為盤盈（填正數）</label>
        <label><input type="checkbox" id="fNoStk" onchange="onInvToggle()"> 本月無盤點</label>
      </div>
    </div>
    <div class="field"><label>經營報酬 <span class="unit">元</span></label><input type="number" id="fReward" inputmode="numeric"></div>
    <button class="btn-primary" onclick="saveMonth()">儲存並比較</button>
    </div>
    <button class="btn-cancel" onclick="closeEdit()">關閉</button>
    <div id="cmpBox"></div>
  </div>
</div>

<div id="toast"></div>

<script>
let currentUser=null, appConfig={}, curStore='', pnlCache={}, editMonth='';
const START='2025-07';
const isAdminOwner=()=>['owner','admin'].includes(currentUser?.permission);
const canUse=()=>['manager','owner','admin'].includes(currentUser?.permission);
const pad=n=>String(n).padStart(2,'0');
const money=n=>Math.round(n||0).toLocaleString('en-US');
const showLoading=t=>{document.getElementById('loadingText').textContent=t||'載入中…';document.getElementById('loadingOverlay').classList.remove('hidden');};
const hideLoading=()=>document.getElementById('loadingOverlay').classList.add('hidden');
let _tt;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),2200);}
function monthLabel(m){const[y,mo]=m.split('-');return `${y} 年 ${parseInt(mo)} 月`;}
function prevYearMonth(m){const[y,mo]=m.split('-');return `${parseInt(y)-1}-${mo}`;}

// 產生月份清單：START ~ 上個月（新→舊）
function monthList(){
  const now=new Date();
  const end=new Date(now.getFullYear(),now.getMonth(),1); end.setMonth(end.getMonth()-1); // 上個月
  const out=[]; let[sy,sm]=START.split('-').map(Number);
  let y=end.getFullYear(),mo=end.getMonth()+1;
  while(y>sy||(y===sy&&mo>=sm)){ out.push(`${y}-${pad(mo)}`); mo--; if(mo<1){mo=12;y--;} }
  return out; // 新→舊
}

window.onload=async()=>{
  showLoading('驗證登入…');
  const saved=localStorage.getItem('currentUser')||sessionStorage.getItem('currentUser');
  if(!saved){location.replace('home.html');return;}
  try{currentUser=JSON.parse(saved);}catch(e){location.replace('home.html');return;}
  const fb=await new Promise(r=>{const u=firebase.auth().onAuthStateChanged(x=>{u();r(x);});});
  if(!fb){localStorage.removeItem('currentUser');location.replace('home.html');return;}
  if(!canUse()){toast('僅店長以上可用');setTimeout(()=>location.replace('home.html'),1200);return;}
  try{
    const s=await window.db.collection('settings').doc('globalConfig').get();
    if(s.exists)appConfig=s.data();
  }catch(e){}
  const stores=appConfig.stores||[];
  if(isAdminOwner()){
    const sel=document.getElementById('storeSel'); sel.style.display='block';
    sel.innerHTML=stores.map(s=>`<option value="${s}">${s}</option>`).join('');
    curStore=stores[0]||currentUser.store||'';
    sel.value=curStore;
  }else{
    curStore=currentUser.store||'';
  }
  await loadList();
  hideLoading();
};

async function onStoreChange(){ curStore=document.getElementById('storeSel').value; showLoading('載入…'); await loadList(); hideLoading(); }

async function loadList(){
  pnlCache={};
  try{
    const snap=await window.db.collection('stores').doc(curStore).collection('pnl').get();
    snap.forEach(d=>pnlCache[d.id]=d.data());
  }catch(e){ toast('讀取失敗：'+e.message); }
  renderList();
}

function renderList(){
  const months=monthList();
  const wrap=document.getElementById('listWrap');
  if(!months.length){ wrap.innerHTML=`<div class="empty">目前沒有需要輸入的月份</div>`; return; }
  const todo=months.filter(m=>!pnlCache[m]);
  let html='';
  if(todo.length) html+=`<div class="sec-title">🔴 待輸入（${todo.length}）</div>`+
    months.filter(m=>!pnlCache[m]).map(m=>monCard(m,false)).join('');
  const done=months.filter(m=>pnlCache[m]);
  if(done.length) html+=`<div class="sec-title">✅ 已輸入（${done.length}）</div>`+
    done.map(m=>monCard(m,true)).join('');
  wrap.innerHTML=html;
}
function monCard(m,done){
  return `<div class="mon-card" onclick="openEdit('${m}')">
    <div class="mon-title">${monthLabel(m)}</div>
    <div class="mon-badge ${done?'b-done':'b-todo'}">${done?'✅ 已輸入':'🔴 待輸入'}</div>
    <div class="mon-arrow">›</div>
  </div>`;
}

function onInvToggle(){
  const noStk=document.getElementById('fNoStk').checked;
  const gain=document.getElementById('fInvGain');
  const inv=document.getElementById('fInv');
  if(noStk){ gain.checked=false; gain.disabled=true; inv.value=''; inv.disabled=true; }
  else { gain.disabled=false; inv.disabled=false; }
}

function openEdit(m){
  editMonth=m;
  document.getElementById('editTitle').textContent=`${monthLabel(m)}　${curStore}`;
  const d=pnlCache[m]||{};
  document.getElementById('fNetSales').value=d.netSales??'';
  document.getElementById('fGross').value=d.grossMargin??'';
  document.getElementById('fBad').value=d.badGoodsCost??'';
  document.getElementById('fSubsidy').value=d.badGoodsSubsidy??'';
  document.getElementById('fReward').value=d.operatingReward??'';
  document.getElementById('fNoStk').checked=!!d.noStocktake;
  document.getElementById('fInvGain').checked=(d.invResult||0)>0;
  document.getElementById('fInv').value=(d.noStocktake||d.invResult==null)?'':Math.abs(d.invResult);
  onInvToggle();
  document.getElementById('cmpBox').innerHTML='';
  if(pnlCache[m]) viewMode(m); else editMode();   // 已輸入→檢視；待輸入→直接編輯
  document.getElementById('editOverlay').classList.add('show');
}
function viewMode(m){
  document.getElementById('formSection').style.display='none';
  document.getElementById('editBtn').style.display='block';
  document.getElementById('editSub').textContent='已輸入 · 點右上「編輯」可修改數字';
  showComparison(m);
}
function editMode(){
  document.getElementById('formSection').style.display='block';
  document.getElementById('editBtn').style.display='none';
  document.getElementById('editSub').textContent=pnlCache[editMonth]?'修改數字後重新儲存並比較':'請照公司損益表填入';
  document.getElementById('cmpBox').innerHTML='';
}
function switchToEdit(){ editMode(); }
function closeEdit(){ document.getElementById('editOverlay').classList.remove('show'); }

const num=id=>{const v=parseFloat(document.getElementById(id).value);return isNaN(v)?null:v;};

async function saveMonth(){
  const netSales=num('fNetSales'), grossMargin=num('fGross'), badGoodsCost=num('fBad'),
        badGoodsSubsidy=num('fSubsidy'), operatingReward=num('fReward');
  const noStocktake=document.getElementById('fNoStk').checked;
  const isGain=document.getElementById('fInvGain').checked;
  let invResult=0, invAmt=num('fInv');
  if(noStocktake){ invResult=null; }
  else { invAmt=invAmt||0; invResult=isGain?Math.abs(invAmt):-Math.abs(invAmt); }
  // 必填檢查（盤損可為 0/無盤點）
  if([netSales,grossMargin,badGoodsCost,badGoodsSubsidy,operatingReward].some(v=>v===null)){
    toast('請完整填寫營業淨額/毛利率/壞品/壞品補貼/經營報酬'); return;
  }
  showLoading('儲存中…');
  const rec={ store:curStore, month:editMonth, netSales, grossMargin, badGoodsCost, badGoodsSubsidy,
    operatingReward, invResult, noStocktake,
    submittedBy:currentUser.empName||'', submittedByName:(currentUser.displayName||currentUser.empName||''),
    submittedAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
  try{
    await window.db.collection('stores').doc(curStore).collection('pnl').doc(editMonth).set(rec,{merge:true});
    pnlCache[editMonth]=rec;
    // 只有「有去年同期資料」才會通知全體（回填月份無同期→不發送）
    let hasPrev=false;
    try{ const ps=await window.db.collection('stores').doc(curStore).collection('pnl').doc(prevYearMonth(editMonth)).get(); hasPrev=ps.exists; }catch(e){}
    toast(hasPrev ? '✅ 已儲存，已通知全體店長' : '✅ 已儲存');
    renderList();
    viewMode(editMonth); // 存完切回檢視模式（只看績效，右上可再編輯）
  }catch(e){ toast('儲存失敗：'+e.message); }
  hideLoading();
}

// 指標比較 → HTML
function fmtInv(rec){
  if(!rec||rec.noStocktake||rec.invResult==null) return '本月無盤點';
  if(rec.invResult<0) return `盤損 ${money(-rec.invResult)}元`;
  if(rec.invResult>0) return `盤盈 ${money(rec.invResult)}元`;
  return '0 元';
}
async function showComparison(m){
  const cur=pnlCache[m];
  const pm=prevYearMonth(m);
  let prev=null;
  try{ const ps=await window.db.collection('stores').doc(curStore).collection('pnl').doc(pm).get(); if(ps.exists)prev=ps.data(); }catch(e){}
  const rows=[];
  const upDown=(curV,prevV,unit,goodUp,fmt)=>{
    if(prev==null||prevV==null) return `<div class="cmp-delta neu">（同期無資料）</div>`;
    const d=curV-prevV, abs=fmt(Math.abs(d));
    const better = goodUp ? d>=0 : d<=0;
    const word = goodUp ? (d>=0?'成長':'衰退') : (d<=0?'減少':'增加');
    const mark = better?'✅':'❌';
    return `<div class="cmp-delta ${better?'up':'down'}">（較同期${word} ${mark} ${abs}${unit}）</div>`;
  };
  const neutralDelta=(curV,prevV,unit,fmt)=>{
    if(prev==null||prevV==null) return `<div class="cmp-delta neu">（同期無資料）</div>`;
    const d=curV-prevV;
    const word=d>=0?'增加':'減少';
    return `<div class="cmp-delta neu">（較同期${word} ${fmt(Math.abs(d))}${unit}）</div>`;
  };
  rows.push(`<div class="cmp-row"><div class="cmp-metric">營業淨額 ${money(cur.netSales)}</div>${upDown(cur.netSales,prev?.netSales,'元',true,money)}</div>`);
  rows.push(`<div class="cmp-row"><div class="cmp-metric">壞品 ${money(cur.badGoodsCost)}元</div>${upDown(cur.badGoodsCost,prev?.badGoodsCost,'元',false,money)}</div>`);
  // 盤損
  let invCmp;
  if(prev==null||prev.noStocktake||prev.invResult==null) invCmp=`<div class="cmp-delta neu">（同期無盤點）</div>`;
  else if(cur.noStocktake||cur.invResult==null) invCmp=`<div class="cmp-delta neu">（本月無盤點）</div>`;
  else invCmp=upDown(cur.invResult,prev.invResult,'元',true,money);
  rows.push(`<div class="cmp-row"><div class="cmp-metric">${fmtInv(cur)}</div>${invCmp}</div>`);
  rows.push(`<div class="cmp-row"><div class="cmp-metric">毛利 ${cur.grossMargin}%</div>${upDown(cur.grossMargin,prev?.grossMargin,'%',true,v=>v.toFixed(2))}</div>`);
  rows.push(`<div class="cmp-row"><div class="cmp-metric">壞品補貼 ${money(cur.badGoodsSubsidy)}元</div>${neutralDelta(cur.badGoodsSubsidy,prev?.badGoodsSubsidy,'元',money)}</div>`);
  rows.push(`<div class="cmp-row"><div class="cmp-metric">經營報酬 ${money(cur.operatingReward)}元</div>${upDown(cur.operatingReward,prev?.operatingReward,'元',true,money)}</div>`);
  document.getElementById('cmpBox').innerHTML=`<div class="cmp"><div class="cmp-title">${curStore} ${m.split('-')[0]}年${parseInt(m.split('-')[1])}月 經營績效</div>${rows.join('')}</div>`;
}
</script>
</body>
</html>

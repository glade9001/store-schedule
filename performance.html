<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="莉學商行">
<link rel="apple-touch-icon" href="icon-192.svg">
<meta name="theme-color" content="#e67e22">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📊 經營績效專區</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="firebase-init.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--primary:#e67e22;--primary-dark:#c0620f;--accent:#34a853;--danger:#d93025;--warn:#f9ab00;
  --bg:#f4f6fb;--text:#1e293b;--text-muted:#64748b;--border:#e2e8f0;--header-h:56px;--radius:14px;}
html,body{height:100%;background:var(--bg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text);}
#loadingOverlay{display:flex;position:fixed;inset:0;background:linear-gradient(135deg,#e67e22,#c0620f);z-index:99999;flex-direction:column;justify-content:center;align-items:center;color:#fff;transition:opacity .4s;}
#loadingOverlay.hidden{opacity:0;pointer-events:none;}
.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:0 14px;height:var(--header-h);display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px rgba(230,126,34,.3);position:sticky;top:0;z-index:100;}
.header-back{background:rgba(255,255,255,.18);border:none;color:#fff;height:34px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;padding:0 12px;white-space:nowrap;}
.header-title{font-size:17px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.header-store{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:5px 8px;font-size:13px;font-weight:700;max-width:130px;}
.header-store option{color:#000;}
.content{padding:14px 12px 90px;max-width:640px;margin:0 auto;}
.note{background:#fff8ee;border:1px solid #ffd8a8;border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.7;color:#8a5a1a;margin-bottom:14px;}
.sec-title{font-size:12px;font-weight:800;color:var(--text-muted);letter-spacing:.5px;margin:16px 4px 8px;}
.mon-card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:13px 15px;margin-bottom:9px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .1s;}
.mon-card:active{transform:scale(.99);}
.mon-title{font-size:15px;font-weight:800;flex:1;}
.mon-badge{font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap;}
.b-done{background:#e6f4ea;color:#137333;}
.b-todo{background:#fce8e6;color:#c5221f;}
.mon-arrow{color:#ccc;font-size:16px;}
.empty{text-align:center;padding:30px 20px;color:var(--text-muted);}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;display:none;align-items:flex-end;justify-content:center;}
.overlay.show{display:flex;}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px 28px;}
.sheet-handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 14px;}
.sheet-title{font-size:18px;font-weight:900;margin-bottom:4px;}
.sheet-sub{font-size:12px;color:var(--text-muted);margin-bottom:16px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px;}
.field input[type=number]{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;font-weight:700;}
.field .unit{font-size:12px;color:var(--text-muted);font-weight:400;}
.chk-row{display:flex;gap:16px;margin-top:8px;}
.chk-row label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;cursor:pointer;}
.chk-row input{width:17px;height:17px;}
.btn-primary{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;margin-top:6px;}
.btn-cancel{width:100%;padding:12px;background:#f1f3f4;color:var(--text);border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;}
/* comparison */
.cmp{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:16px;margin-top:14px;}
.cmp-title{font-size:16px;font-weight:900;margin-bottom:12px;text-align:center;}
.cmp-row{padding:9px 0;border-bottom:1px dashed var(--border);}
.cmp-row:last-child{border-bottom:none;}
.cmp-metric{font-size:15px;font-weight:800;}
.cmp-delta{font-size:12.5px;margin-top:2px;}
.up{color:#137333;} .down{color:#c5221f;} .neu{color:var(--text-muted);}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:11px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:99999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
#toast.show{opacity:1;}
.tabbar{display:flex;gap:8px;padding:10px 12px 0;max-width:640px;margin:0 auto;}
.tab{flex:1;padding:11px;border:none;border-radius:12px 12px 0 0;background:#eef1f6;color:var(--text-muted);font-size:14px;font-weight:800;cursor:pointer;}
.tab.active{background:#fff;color:var(--primary);box-shadow:0 -2px 8px rgba(0,0,0,.05);}
.chart-card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:14px;margin-bottom:14px;}
.chart-title{font-size:14px;font-weight:800;margin-bottom:8px;}
.kpi-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.kpi{flex:1;min-width:90px;background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:12px 10px;}
.kpi-label{font-size:11px;color:var(--text-muted);font-weight:700;}
.kpi-val{font-size:18px;font-weight:900;margin-top:2px;line-height:1.2;}
.kpi-delta{font-size:11px;margin-top:4px;font-weight:800;}
</style>
</head>
<body>
<div id="loadingOverlay"><div class="spinner"></div><div id="loadingText">載入中…</div></div>

<div class="header">
  <button class="header-back" onclick="window.location.href=(new URLSearchParams(location.search).get('ref')||'home.html')">← 首頁</button>
  <div class="header-title">📊 經營績效專區</div>
  <select class="header-store" id="storeSel" onchange="onStoreChange()" style="display:none;"></select>
</div>

<div class="tabbar">
  <button class="tab active" id="tab-input" onclick="switchTab('input')">📝 損益輸入</button>
  <button class="tab" id="tab-analysis" onclick="switchTab('analysis')">📊 統計分析</button>
</div>

<div class="content">
  <div id="tabInput">
    <div class="note">
      📅 公司每月 <b>4–7 號</b>寄門市損益表，請於 <b>10 號前</b>輸入「上一個月」的數據（例：7 月輸入 6 月）。<br>
      首次請從 <b>2025 年 7 月</b>起補齊；輸入完成後會與<b>去年同期</b>比較，並自動通知全體店長與加盟主。
    </div>
    <div id="listWrap"></div>
  </div>
  <div id="tabAnalysis" style="display:none;"></div>
</div>

<!-- 輸入 sheet -->
<div class="overlay" id="editOverlay" onclick="if(event.target===this)closeEdit()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div style="display:flex;align-items:flex-start;gap:8px;">
      <div class="sheet-title" id="editTitle" style="flex:1;">輸入損益</div>
      <button id="editBtn" onclick="switchToEdit()" style="display:none;background:#fff3e0;color:#c0620f;border:1.5px solid #e67e22;border-radius:9px;padding:6px 12px;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap;">✏️ 編輯</button>
    </div>
    <div class="sheet-sub" id="editSub"></div>
    <div id="formSection">
    <div class="field"><label>營業淨額 <span class="unit">元</span></label><input type="number" id="fNetSales" inputmode="numeric"></div>
    <div class="field"><label>壞品（成本）<span class="unit">元</span></label><input type="number" id="fBad" inputmode="numeric"></div>
    <div class="field">
      <label>盤點結果 <span class="unit">選狀態＋填正金額，系統自動判定正負</span></label>
      <div class="chk-row" style="gap:14px;flex-wrap:wrap;">
        <label><input type="radio" name="invType" value="loss" onchange="onInvChange()"> 盤損（少了）</label>
        <label><input type="radio" name="invType" value="gain" onchange="onInvChange()"> 盤盈（多了）</label>
        <label><input type="radio" name="invType" value="none" onchange="onInvChange()"> 本月無盤點</label>
      </div>
      <input type="number" id="fInv" inputmode="numeric" placeholder="填正金額，例：7751" oninput="onInvChange()">
      <div id="invPreview" style="font-size:12px;font-weight:800;margin-top:5px;"></div>
    </div>
    <div class="field"><label>毛利率 <span class="unit">% （例：29.32）</span></label><input type="number" id="fGross" step="0.01" inputmode="decimal"></div>
    <div class="field"><label>門市電費 <span class="unit">元（含在經營報酬內）</span></label><input type="number" id="fElec" inputmode="numeric"></div>
    <div class="field"><label>雜支 <span class="unit">元（含在經營報酬內）</span></label><input type="number" id="fMisc" inputmode="numeric"></div>
    <div class="field">
      <label>現金短溢 <span class="unit">選狀態＋填正金額，系統自動判定正負（對照損益表「管銷費用」：正＝短少、負＝溢餘）</span></label>
      <div class="chk-row" style="gap:14px;flex-wrap:wrap;">
        <label><input type="radio" name="cashType" value="short" onchange="onCashChange()"> 短少（少了）</label>
        <label><input type="radio" name="cashType" value="over" onchange="onCashChange()"> 溢餘（多了）</label>
        <label><input type="radio" name="cashType" value="none" onchange="onCashChange()"> 本月無短溢</label>
      </div>
      <input type="number" id="fCash" inputmode="numeric" placeholder="填正金額，例：損益表寫 500 或 -600 都填數字本身" oninput="onCashChange()">
      <div id="cashPreview" style="font-size:12px;font-weight:800;margin-top:5px;"></div>
    </div>
    <div class="field"><label>經營報酬 <span class="unit">元</span></label><input type="number" id="fReward" inputmode="numeric"></div>
    <button class="btn-primary" onclick="saveMonth()">儲存並比較</button>
    </div>
    <button class="btn-cancel" onclick="closeEdit()">關閉</button>
    <div id="cmpBox"></div>
  </div>
</div>

<div id="toast"></div>
<div id="ptPop" onclick="this.style.display='none'" style="display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fff;border:1.5px solid var(--border);box-shadow:0 6px 24px rgba(0,0,0,.18);border-radius:14px;padding:12px 18px;z-index:99998;max-width:88vw;text-align:center;cursor:pointer;"></div>

<script src="performance-page.js"></script>
</body>
</html>

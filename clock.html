<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="莉學商行">
<link rel="apple-touch-icon" href="icon-192.svg">
<meta name="theme-color" content="#e67e22">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🕐 打卡</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>
<script src="firebase-init.js"></script>
<script src="utils.js"></script>
<script src="shift-utils.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--primary:#e67e22;--primary-dark:#c0620f;--accent:#34a853;--danger:#d93025;--warn:#f9ab00;--bg:#f4f6fb;--text:#1e293b;--text-muted:#64748b;--border:#e2e8f0;--header-h:56px;}
html,body{height:100%;background:var(--bg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text);}
#loadingOverlay{display:flex;position:fixed;inset:0;background:linear-gradient(135deg,#e67e22,#c0620f);z-index:99999;flex-direction:column;justify-content:center;align-items:center;color:#fff;transition:opacity .4s;}
#loadingOverlay.hidden{opacity:0;pointer-events:none;}
.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:0 14px;height:var(--header-h);display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px rgba(230,126,34,.3);position:sticky;top:0;z-index:100;}
.header-back{background:rgba(255,255,255,.18);border:none;color:#fff;height:34px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;padding:0 12px;white-space:nowrap;}
.header-title{font-size:17px;font-weight:800;flex:1;}
.wrap{max-width:520px;margin:0 auto;padding:16px;}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);padding:18px;margin-bottom:14px;}
.today{font-size:15px;font-weight:800;text-align:center;}
.sub{font-size:13px;color:var(--text-muted);text-align:center;margin-top:2px;}
.locbox{margin:14px 0;padding:12px;border-radius:12px;text-align:center;font-size:14px;font-weight:800;}
.loc-ok{background:#e6f4ea;color:#137333;}
.loc-bad{background:#fce8e6;color:#c5221f;}
.loc-wait{background:#f1f5f9;color:#64748b;}
.shiftinfo{text-align:center;font-size:14px;margin:6px 0 2px;font-weight:700;}
.punch-btn{width:100%;padding:20px;border:none;border-radius:16px;font-size:20px;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.15);margin-top:8px;transition:transform .1s;}
.punch-btn:active{transform:scale(.98);}
.punch-in{background:linear-gradient(135deg,#34a853,#1e7e34);}
.punch-out{background:linear-gradient(135deg,#d93025,#a52714);}
.punch-visit{background:linear-gradient(135deg,#1a73e8,#0d47a1);}
.punch-btn:disabled{background:#cbd5e1;color:#fff;cursor:default;box-shadow:none;}
.plist{margin-top:6px;}
.pitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:#f8fafc;margin-bottom:6px;font-size:14px;}
.ptag{font-size:12px;font-weight:900;border-radius:6px;padding:2px 8px;white-space:nowrap;}
.tag-in{background:#e6f4ea;color:#137333;}.tag-out{background:#fce8e6;color:#c5221f;}.tag-visit{background:#e3f2fd;color:#1565c0;}
.pstat{margin-left:auto;font-size:12px;font-weight:800;}
.stat-ok{color:#137333;}.stat-warn{color:#f9ab00;}.stat-bad{color:#d93025;}.stat-visit{color:#1565c0;}
.maint{text-align:center;padding:40px 20px;}
.maint-icon{font-size:52px;margin-bottom:14px;}
.maint-title{font-size:20px;font-weight:900;margin-bottom:8px;}
.maint-sub{font-size:14px;color:var(--text-muted);}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:11px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:99999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:90vw;}
#toast.show{opacity:1;}
</style>
</head>
<body>
<div id="loadingOverlay"><div class="spinner"></div><div id="loadingText">載入中…</div></div>
<div class="header">
  <button class="header-back" onclick="window.location.href='home.html'">← 首頁</button>
  <div class="header-title">🕐 打卡</div>
</div>
<div class="wrap" id="wrap"></div>
<div id="toast"></div>
<div id="otModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9500;align-items:center;justify-content:center;padding:18px;">
  <div style="background:#fff;border-radius:16px;max-width:400px;width:100%;padding:20px;">
    <div style="font-size:17px;font-weight:900;margin-bottom:8px;">⏰ 非排班時段打卡</div>
    <div id="otMsg" style="font-size:13px;color:#475569;line-height:1.7;margin-bottom:6px;"></div>
    <div id="otHint" style="font-size:13px;color:#475569;line-height:1.7;margin-bottom:14px;"></div>
    <div id="otContentRow" style="display:none;margin-bottom:12px;">
      <label style="display:block;font-size:12px;font-weight:700;margin-bottom:5px;">加班內容／事由（必填）</label>
      <textarea id="otContent" rows="3" placeholder="例：主管交辦盤點、支援出餐尖峰…" style="width:100%;padding:10px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;font-family:inherit;resize:vertical;"></textarea>
      <div style="font-size:11px;color:#94a3b8;margin-top:6px;line-height:1.5;">送出後需<b>店長審核</b>；同意才計入工時，並請店長調整排班表。</div>
    </div>
    <button id="otApplyBtn" onclick="otChooseApply()" style="width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;margin-bottom:8px;">📝 我要申請加班</button>
    <button id="otPrivateBtn" onclick="otChoosePrivate()" style="width:100%;padding:11px;background:#f1f5f9;color:#334155;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;margin-bottom:8px;">否，僅到場／私事（不計工時）</button>
    <button onclick="otCancel()" style="width:100%;padding:9px;background:none;color:#94a3b8;border:none;font-size:13px;font-weight:700;cursor:pointer;">取消打卡</button>
  </div>
</div>
<div id="forgotModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9500;align-items:center;justify-content:center;padding:18px;">
  <div style="background:#fff;border-radius:16px;max-width:400px;width:100%;padding:20px;">
    <div style="font-size:17px;font-weight:900;margin-bottom:8px;">🕐 你比班別開始時間晚了</div>
    <div id="fgMsg" style="font-size:13px;color:#475569;line-height:1.7;margin-bottom:12px;"></div>
    <div style="font-size:13px;color:#475569;line-height:1.7;margin-bottom:12px;">是不是<b>準時上班、只是忘了打卡</b>？<br>若是，請填你<b>實際上班時間</b>，系統會照常記下這次打卡（含定位），並把你填的時間<b>送店長核對更正</b>。</div>
    <div id="fgRow" style="display:none;margin-bottom:12px;">
      <label style="display:block;font-size:12px;font-weight:700;margin-bottom:5px;">實際上班時間</label>
      <input type="time" id="fgTime" style="width:100%;padding:10px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:15px;">
      <div style="font-size:11px;color:#94a3b8;margin-top:6px;line-height:1.5;">送出後由<b>店長核對</b>，同意才更正時間；原打卡時間會保留備查。</div>
    </div>
    <button id="fgYesBtn" onclick="fgChooseForgot()" style="width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;margin-bottom:8px;">是，我忘了打卡（填實際時間）</button>
    <button onclick="fgChooseLate()" style="width:100%;padding:11px;background:#f1f5f9;color:#334155;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;margin-bottom:8px;">否，照常打卡</button>
    <button onclick="fgCancel()" style="width:100%;padding:9px;background:none;color:#94a3b8;border:none;font-size:13px;font-weight:700;cursor:pointer;">取消打卡</button>
  </div>
</div>
<div id="reqModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9500;align-items:center;justify-content:center;padding:18px;">
  <div style="background:#fff;border-radius:16px;max-width:400px;width:100%;padding:20px;max-height:90vh;overflow:auto;">
    <div style="font-size:17px;font-weight:900;margin-bottom:6px;">📝 補登／修改打卡申請</div>
    <div style="font-size:12px;color:#64748b;margin-bottom:12px;line-height:1.7;">忘記打卡、被誤判遲到／缺卡→填正確時間送出。需<b>店長審核</b>（結果 LINE 通知你）。該日已有同類打卡＝申請<b>修改時間</b>；沒有＝<b>補登</b>。</div>
    <label style="font-size:13px;font-weight:700;">門市</label>
    <select id="rqStore" style="width:100%;padding:9px;border:1.5px solid #e2e8f0;border-radius:8px;margin:4px 0 4px;"></select>
    <div id="rqStoreHint" style="font-size:12px;color:#64748b;margin:0 0 10px;line-height:1.5;"></div>
    <label style="font-size:13px;font-weight:700;">日期</label>
    <input type="date" id="rqDate" onchange="syncReqStore()" style="width:100%;padding:9px;border:1.5px solid #e2e8f0;border-radius:8px;margin:4px 0 10px;">
    <label style="font-size:13px;font-weight:700;">打卡類型</label>
    <select id="rqType" style="width:100%;padding:9px;border:1.5px solid #e2e8f0;border-radius:8px;margin:4px 0 10px;"><option>上班</option><option>下班</option></select>
    <label style="font-size:13px;font-weight:700;">正確時間</label>
    <input type="time" id="rqTime" style="width:100%;padding:9px;border:1.5px solid #e2e8f0;border-radius:8px;margin:4px 0 10px;">
    <label style="font-size:13px;font-weight:700;">原因</label>
    <textarea id="rqReason" rows="2" placeholder="例：忘記打卡被判遲到，實際 09:00 上班" style="width:100%;padding:9px;border:1.5px solid #e2e8f0;border-radius:8px;margin:4px 0 12px;font-family:inherit;"></textarea>
    <div style="display:flex;gap:8px;">
      <button onclick="document.getElementById('reqModal').style.display='none'" style="flex:1;padding:11px;background:#eef1f4;border:none;border-radius:10px;font-weight:700;cursor:pointer;">取消</button>
      <button onclick="submitReq()" style="flex:1;padding:11px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-weight:800;cursor:pointer;">送出申請</button>
    </div>
  </div>
</div>
<script src="clock-page.js"></script>
</body>
</html>

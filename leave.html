<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="莉學商行">
<link rel="apple-touch-icon" href="icon-192.svg">
<meta name="theme-color" content="#1a73e8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏖️ 特補休管理</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="firebase-init.js"></script>
<link rel="stylesheet" href="leave-page.css">
</head>
<body>
<div id="loadingOverlay"><div class="spinner"></div><div id="loadingText">載入中...</div></div>

<div id="appShell">
  <div class="header">
    <button class="header-back" onclick="handleBack()">← 首頁</button>
    <div class="header-title" id="headerTitle">🏖️ 特補休管理</div>
    <div class="header-badge" id="headerBadge">--</div>
    <button class="header-action" id="reportBtn" style="display:none;" onclick="openReport()">📊 年度報表</button>
  </div>

  <!-- 加盟主門市切換 -->
  <div class="store-bar" id="storeBar"></div>

  <!-- Tab -->
  <div class="tab-bar" id="tabBar" style="display:none;">
    <div class="tab-item active" id="tab-overview" onclick="switchTab('overview')">📊 總覽</div>
    <div class="tab-item" id="tab-detail" onclick="switchTab('detail')">📋 明細</div>
  </div>

  <div class="content" id="mainContent">
    <div class="empty-state"><div class="spinner" style="border-top-color:var(--primary);border-color:var(--border);margin:0 auto 10px;width:32px;height:32px;border-width:3px;"></div></div>
  </div>
</div>

<!-- ===== 到職日設定 Modal ===== -->
<div class="modal-overlay" id="hireDateModal" onclick="if(event.target===this)closeModal('hireDateModal')">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-title" id="hireDateTitle">設定到職日</div>
    <div class="modal-sub">設定到職日後，系統將自動依勞基法計算週年制特休批次。</div>
    <div class="modal-body">
      <input type="hidden" id="hireDateEmpName">
      <div class="form-field">
        <label>員工姓名</label>
        <input type="text" id="hireDateEmpDisplay" readonly style="background:#f1f3f4;">
      </div>
      <div class="form-field">
        <label>到職日期</label>
        <input type="date" id="hireDateInput">
      </div>
      <div id="manualDaysGroup" style="display:none;">
        <div class="private-hint">📝 工讀生特休規則尚未定案，請手動輸入年度特休天數</div>
        <div class="form-field">
          <label>年度特休天數（手動設定）</label>
          <input type="number" id="manualAnnualDays" min="0" max="30" step="1" placeholder="請輸入天數">
        </div>
      </div>
      <div id="autoDaysPreview" style="display:none;background:#e8f0fe;border-radius:10px;padding:12px;font-size:13px;line-height:1.8;margin-bottom:12px;"></div>
      <!-- 僅系統管理員可見：略過已到期批次 -->
      <div id="skipExpiredGroup" style="display:none;background:#fff8e1;border:1.5px solid #ffcc80;border-radius:10px;padding:12px;margin-bottom:14px;">
        <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;">
          <input type="checkbox" id="skipExpiredCheck" style="width:18px;height:18px;margin-top:2px;flex-shrink:0;cursor:pointer;">
          <div>
            <div style="font-size:13px;font-weight:800;color:#e65100;">⚙️ 略過已到期批次（歷史建檔用）</div>
            <div style="font-size:11px;color:#b45309;margin-top:3px;line-height:1.6;">勾選後，到期日已過的批次將不會建入系統。<br>適用於系統上線時，過去批次已自行消化完畢的舊員工。</div>
          </div>
        </label>
      </div>
      <button class="modal-action" onclick="saveHireDate()">確認設定</button>
      <button class="modal-cancel" onclick="closeModal('hireDateModal')">取消</button>
    </div>
  </div>
</div>

<!-- ===== 手動新增批次 Modal ===== -->
<div class="modal-overlay" id="addBatchModal" onclick="if(event.target===this)closeModal('addBatchModal')">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-title">手動新增特休批次</div>
    <div class="modal-body">
      <input type="hidden" id="addBatchEmp">
      <div class="form-field"><label>發放日</label><input type="date" id="addBatchGrantDate"></div>
      <div class="form-field"><label>到期日</label><input type="date" id="addBatchExpireDate"></div>
      <div class="form-field"><label>天數</label><input type="number" id="addBatchDays" min="0.5" step="0.5"></div>
      <div class="form-field"><label>說明（如：滿6個月、滿1年）</label><input type="text" id="addBatchNote" placeholder="說明"></div>
      <button class="modal-action" onclick="saveAddBatch()">新增批次</button>
      <button class="modal-cancel" onclick="closeModal('addBatchModal')">取消</button>
    </div>
  </div>
</div>

<!-- ===== 新增 leaveLog Modal ===== -->
<div class="modal-overlay" id="addLogModal" onclick="if(event.target===this)closeModal('addLogModal')">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-title" id="addLogTitle">手動新增紀錄</div>
    <div class="modal-body">
      <input type="hidden" id="addLogEmpName">
      <div class="form-field">
        <label>類型</label>
        <select id="addLogType">
          <option value="comp_earn">補休 — 取得（發放）</option>
          <option value="comp_cancel">補休 — 取消取得</option>
        </select>
      </div>
      <div class="form-field"><label>日期</label><input type="date" id="addLogDate"></div>
      <div class="form-field"><label>天數</label><input type="number" id="addLogDays" min="0.5" step="0.5"></div>
      <div class="form-field"><label>說明</label><input type="text" id="addLogNote" placeholder="說明（選填）"></div>
      <button class="modal-action" onclick="saveAddLog()">儲存</button>
      <button class="modal-cancel" onclick="closeModal('addLogModal')">取消</button>
    </div>
  </div>
</div>

<!-- ===== 編輯 leaveLog Modal ===== -->
<div class="modal-overlay" id="editLogModal" onclick="if(event.target===this)closeModal('editLogModal')">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-title">✏️ 編輯紀錄</div>
    <div class="modal-body">
      <input type="hidden" id="editLogEmpName">
      <input type="hidden" id="editLogYm">
      <input type="hidden" id="editLogIdx">
      <div class="form-field">
        <label>類型</label>
        <select id="editLogType">
          <option value="comp_earn">補休 — 取得（發放）</option>
          <option value="comp_cancel">補休 — 取消取得</option>
        </select>
      </div>
      <div class="form-field"><label>日期</label><input type="date" id="editLogDate"></div>
      <div class="form-field"><label>天數</label><input type="number" id="editLogDays" min="0.5" step="0.5"></div>
      <div class="form-field"><label>說明</label><input type="text" id="editLogNote" placeholder="說明"></div>
      <button class="modal-action" onclick="saveEditLog()">儲存修改</button>
      <button class="modal-cancel" onclick="closeModal('editLogModal')">取消</button>
    </div>
  </div>
</div>

<!-- ===== 結算 / 遞延 Modal（特休批次）===== -->
<div class="modal-overlay" id="settleCarryModal" onclick="if(event.target===this)closeModal('settleCarryModal')">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-title" id="scModalTitle">處理到期特休</div>
    <div class="modal-body">
      <input type="hidden" id="scEmpName">
      <input type="hidden" id="scBatchId">
      <input type="hidden" id="scCanCarry">
      <div class="danger-hint" id="scHint">⚠️ 此批次特休本月到期，請選擇處理方式。處理完成前薪資無法送出審核。</div>
      <div id="scInfo" style="background:#f8fafc;border-radius:10px;padding:12px;margin-bottom:14px;font-size:13px;line-height:2;"></div>
      <button class="modal-action settle" id="scSettleBtn" onclick="doSettle()">💰 結算薪資（將剩餘天數折算工資）</button>
      <button class="modal-action warn" id="scCarryBtn" onclick="doCarry()" style="margin-top:8px;">📌 遞延一年</button>
      <button class="modal-cancel" onclick="closeModal('settleCarryModal')">稍後處理</button>
    </div>
  </div>
</div>

<!-- ===== 補休結算 / 遞延 Modal ===== -->
<div class="modal-overlay" id="compSettleModal" onclick="if(event.target===this)closeModal('compSettleModal')">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-title" id="csModalTitle">處理到期補休</div>
    <div class="modal-body">
      <input type="hidden" id="csEmpName">
      <input type="hidden" id="csCompYear">
      <input type="hidden" id="csCanCarry">
      <div class="danger-hint" id="csHint">⚠️ 此補休本月底到期，請選擇處理方式。</div>
      <div id="csInfo" style="background:#f8fafc;border-radius:10px;padding:12px;margin-bottom:14px;font-size:13px;line-height:2;"></div>
      <button class="modal-action settle" onclick="doCompSettle()">💰 結算薪資</button>
      <button class="modal-action warn" id="csCarryBtn" onclick="doCompCarry()" style="margin-top:8px;">📌 遞延至明年12/31</button>
      <button class="modal-cancel" onclick="closeModal('compSettleModal')">稍後處理</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="leave-page.js"></script>
</body>
</html>

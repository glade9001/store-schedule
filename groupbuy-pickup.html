<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e2140">
<title>📦 取貨名單</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="firebase-init.js"></script>
<script src="gb-common.js"></script>
<link rel="stylesheet" href="groupbuy.css">
</head>
<body>
<div id="loadingOverlay"><div class="spinner"></div><div id="loadingText">載入中…</div></div>
<div class="header">
  <button class="header-back" onclick="location.href='home.html'">← 首頁</button>
  <div class="header-title">📦 取貨名單</div>
</div>
<div class="wrap">
  <div class="toolbar">
    <select id="pkStore" aria-label="門市" onchange="loadPickup()"></select>
    <select id="pkCamp" aria-label="團購" onchange="renderPickup()"><option value="">全部團購</option></select>
    <input id="pkSearch" type="search" placeholder="🔍 搜尋暱稱" aria-label="搜尋暱稱" oninput="renderPickup()">
  </div>
  <div class="chips" id="pkChips"></div>
  <div class="sum" id="pkSum"></div>
  <div id="pkList"><div class="empty">載入中…</div></div>
</div>

<!-- 確認 -->
<div class="modal" id="confirmModal" hidden>
  <div class="sheet">
    <h3 id="cmTitle">確認</h3>
    <p class="lead" id="cmText"></p>
    <div class="sheet-btns">
      <button type="button" class="btn btn-g" id="cmNo">取消</button>
      <button type="button" class="btn btn-p" id="cmYes">確定</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="groupbuy-pickup-page.js"></script>
</body>
</html>

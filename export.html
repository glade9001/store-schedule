<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📊 資料匯出</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="firebase-init.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --primary:#1a73e8;--primary-dark:#1557b0;--accent:#34a853;
  --danger:#d93025;--warn:#f9ab00;--bg:#f0f4ff;
  --text:#1e293b;--text-muted:#64748b;--border:#e2e8f0;--radius:14px;
}
html,body{min-height:100%;background:var(--bg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text);}
#loadingOverlay{display:flex;position:fixed;inset:0;background:linear-gradient(135deg,#1a73e8,#0d47a1);z-index:99999;flex-direction:column;justify-content:center;align-items:center;color:white;transition:opacity 0.4s;}
#loadingOverlay.hidden{opacity:0;pointer-events:none;}
.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px;}
@keyframes spin{to{transform:rotate(360deg);}}
#loadingText{font-size:14px;font-weight:600;opacity:0.9;text-align:center;padding:0 24px;}
.header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;padding:0 16px;height:56px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px rgba(26,115,232,0.3);}
.header-back{background:rgba(255,255,255,0.2);border:none;color:white;height:34px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;padding:0 12px;}
.header-title{font-size:16px;font-weight:800;flex:1;}
.content{max-width:600px;margin:0 auto;padding:20px 16px 60px;}
.card{background:white;border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.card-title{font-size:14px;font-weight:900;color:var(--primary);margin-bottom:14px;}
.form-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.form-label{font-size:13px;font-weight:700;color:var(--text-muted);width:68px;flex-shrink:0;}
.form-select{flex:1;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-weight:600;background:white;color:var(--text);}
.form-select:focus{outline:none;border-color:var(--primary);}
.hint{font-size:11px;color:var(--text-muted);margin-top:4px;line-height:1.5;}
.check-list{display:flex;flex-direction:column;gap:8px;}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:10px;border:1.5px solid var(--border);cursor:pointer;transition:border-color .2s,background .2s;}
.check-item.checked{border-color:var(--primary);background:#eff6ff;}
.check-item input[type=checkbox]{width:18px;height:18px;margin-top:1px;cursor:pointer;flex-shrink:0;accent-color:var(--primary);}
.check-item-title{font-size:13px;font-weight:800;color:var(--text);}
.check-item-desc{font-size:11px;color:var(--text-muted);margin-top:2px;line-height:1.5;}
.format-row{display:flex;gap:8px;}
.format-btn{flex:1;padding:10px;border:1.5px solid var(--border);border-radius:10px;background:white;font-size:13px;font-weight:700;cursor:pointer;text-align:center;color:var(--text-muted);transition:all .2s;}
.format-btn.active{border-color:var(--primary);background:#eff6ff;color:var(--primary);}
.export-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;border:none;border-radius:12px;font-size:16px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 16px rgba(26,115,232,.35);transition:opacity .2s;}
.export-btn:hover{opacity:.92;}
.export-btn:disabled{opacity:.4;cursor:not-allowed;}
.progress-area{margin-top:14px;display:none;}
.progress-bar-wrap{background:#e2e8f0;border-radius:8px;height:8px;overflow:hidden;margin-bottom:8px;}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:8px;transition:width .3s;}
.progress-text{font-size:12px;color:var(--text-muted);font-weight:600;}
.progress-log{margin-top:6px;font-size:11px;color:var(--text-muted);line-height:1.8;max-height:100px;overflow-y:auto;}
.summary-card{background:#f0f7ff;border:1.5px solid #bfdbfe;border-radius:10px;padding:14px 16px;margin-top:12px;display:none;}
.summary-title{font-size:12px;font-weight:800;color:#1e3a8a;margin-bottom:10px;}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.summary-item{text-align:center;background:white;border-radius:8px;padding:8px 4px;}
.summary-num{font-size:18px;font-weight:900;color:var(--primary);}
.summary-label{font-size:10px;color:var(--text-muted);font-weight:600;margin-top:2px;}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}

/* H/I. PDF 模式 */
.pdf-mode-row{display:flex;gap:8px;margin-top:10px;}
.count-badge{font-size:10px;color:#94a3b8;font-weight:600;}
.col-toggle-wrap{background:#f8fafc;border-radius:10px;padding:10px 14px;margin:8px 16px 0;}
.col-toggle-title{font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:8px;}
.col-toggle-grid{display:flex;flex-wrap:wrap;gap:8px;}
.col-toggle-item{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;cursor:pointer;}
.col-toggle-item input{width:15px;height:15px;accent-color:var(--primary);}

/* ===== PDF 列印樣式 ===== */
#pdfContent { font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",Arial,sans-serif; font-size:11px; color:#1e293b; }
.pdf-page { background:white; width:100%; max-width:1100px; margin:0 auto 24px; border-radius:8px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,0.12); }
.pdf-page-landscape { max-width:100%; }
.pdf-header { background:linear-gradient(135deg,#1a73e8,#1557b0); color:white; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; }
.pdf-header-title { font-size:16px; font-weight:900; }
.pdf-header-sub { font-size:11px; opacity:0.85; }
.pdf-body { padding:16px 20px; }
.pdf-section { margin-bottom:18px; }
.pdf-section-title { font-size:12px; font-weight:900; color:#1a73e8; border-left:4px solid #1a73e8; padding-left:8px; margin-bottom:8px; }
.pdf-table { width:100%; border-collapse:collapse; font-size:10.5px; }
.pdf-table th { background:#1a73e8; color:white; padding:5px 7px; text-align:center; font-weight:700; white-space:nowrap; }
.pdf-table td { padding:4px 7px; border-bottom:1px solid #e2e8f0; text-align:center; }
.pdf-table tr:nth-child(even) td { background:#f8fafc; }
.pdf-table .subtotal td { background:#dbeafe; font-weight:800; }
.pdf-table .grand-total td { background:#1e3a8a; color:white; font-weight:900; font-size:11px; }
.pdf-table .section-header td { background:#f1f5f9; font-weight:800; color:#475569; text-align:left; padding-left:10px; }
.pdf-table .warn-red td { color:#dc2626; }
.pdf-table .warn-orange td { color:#ea580c; }
.pdf-table .warn-yellow td { color:#ca8a04; }
.badge-green { background:#dcfce7; color:#16a34a; border-radius:4px; padding:1px 6px; font-weight:700; font-size:10px; }
.badge-red { background:#fee2e2; color:#dc2626; border-radius:4px; padding:1px 6px; font-weight:700; font-size:10px; }
.badge-orange { background:#ffedd5; color:#ea580c; border-radius:4px; padding:1px 6px; font-weight:700; font-size:10px; }
.badge-blue { background:#dbeafe; color:#1d4ed8; border-radius:4px; padding:1px 6px; font-weight:700; font-size:10px; }
.pdf-summary-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px; }
.pdf-summary-box { background:#f0f7ff; border:1.5px solid #bfdbfe; border-radius:8px; padding:10px; text-align:center; }
.pdf-summary-num { font-size:20px; font-weight:900; color:#1a73e8; }
.pdf-summary-label { font-size:10px; color:#64748b; margin-top:2px; }
.pdf-alert { background:#fffbeb; border:1.5px solid #fde68a; border-radius:8px; padding:10px 14px; margin-bottom:10px; font-size:11px; }
.pdf-alert-title { font-weight:800; color:#92400e; margin-bottom:4px; }
.pdf-footer { background:#f8fafc; border-top:1px solid #e2e8f0; padding:8px 20px; font-size:10px; color:#94a3b8; display:flex; justify-content:space-between; }

@media print {
  body > *:not(#pdfModal) { display:none !important; }
  #pdfModal { position:static !important; background:none !important; display:block !important; }
  #pdfModal > div:first-child { display:none !important; }
  #pdfPreviewBody { padding:0 !important; background:none !important; overflow:visible !important; }
  .pdf-page { box-shadow:none; border-radius:0; margin:0; page-break-after:always; }
  .pdf-page:last-child { page-break-after:auto; }
  @page { size:A4 portrait; margin:8mm; }
  @page.landscape { size:A4 landscape; }
}
</style>
</head>
<body>
<div id="loadingOverlay"><div class="spinner"></div><div id="loadingText">載入中...</div></div>

<div class="header">
  <button class="header-back" onclick="window.location.href=(new URLSearchParams(location.search).get('ref')||'home.html')">← 首頁</button>
  <div class="header-title">📊 資料匯出</div>
</div>

<div class="content">
  <div class="card">
    <div class="card-title">📅 選擇匯出月份</div>
    <div class="form-row">
      <span class="form-label">年份</span>
      <select class="form-select" id="selYear" onchange="updateCounts()"></select>
    </div>
    <div class="form-row">
      <span class="form-label">月份</span>
      <select class="form-select" id="selMonth" onchange="updateCounts()">
        <option value="01">1 月</option><option value="02">2 月</option>
        <option value="03">3 月</option><option value="04">4 月</option>
        <option value="05">5 月</option><option value="06">6 月</option>
        <option value="07">7 月</option><option value="08">8 月</option>
        <option value="09">9 月</option><option value="10">10 月</option>
        <option value="11">11 月</option><option value="12">12 月</option>
      </select>
    </div>
    <div class="hint">特補休紀錄將匯出所選年度 1 月至所選月份的完整紀錄</div>
  </div>

  <div class="card">
    <div class="card-title">📋 匯出內容（四個工作表）</div>
    <div class="check-list">
      <label class="check-item checked" id="ci-summary">
        <input type="checkbox" id="chk-summary" checked onchange="toggleCheck('summary')">
        <div class="check-item-text">
          <div class="check-item-title">① 人事費用摘要</div>
          <div class="check-item-desc">各門市薪資合計・實際人事成本・特補休警示・異常提示<span class="count-badge" id="count-badge-summary"></span></div>
        </div>
      </label>
      <label class="check-item checked" id="ci-emp">
        <input type="checkbox" id="chk-emp" checked onchange="toggleCheck('emp')">
        <div class="check-item-text">
          <div class="check-item-title">② 員工資料</div>
          <div class="check-item-desc">在職年資・底薪/時薪說明・保費・特補休餘額・特休發放狀態・到期警示<span class="count-badge" id="count-badge-emp"></span></div>
        </div>
      </label>
      <label class="check-item checked" id="ci-leave">
        <input type="checkbox" id="chk-leave" checked onchange="toggleCheck('leave')">
        <div class="check-item-text">
          <div class="check-item-title">③ 特補休紀錄</div>
          <div class="check-item-desc">特休＋補休流水明細（含操作人）・各員工統計・年度折現金額・到期日<span class="count-badge" id="count-badge-leave"></span></div>
        </div>
      </label>
      <label class="check-item checked" id="ci-salary">
        <input type="checkbox" id="chk-salary" checked onchange="toggleCheck('salary')">
        <div class="check-item-text">
          <div class="check-item-title">④ 薪資明細</div>
          <div class="check-item-desc">完整薪資項目・門市小計・全店合計・公司勞退提撥(6%)・實際人事成本<span class="count-badge" id="count-badge-salary"></span></div>
        </div>
      </label>
    </div>
  </div>

  <div class="card">
    <div class="card-title">💾 匯出格式</div>
    <div class="format-row">
      <button class="format-btn active" id="fmt-xlsx" onclick="setFormat('xlsx')">📊 Excel (.xlsx)</button>
      <button class="format-btn" id="fmt-csv" onclick="setFormat('csv')">📄 CSV (.csv)</button>
    </div>
    <div class="hint" id="fmt-note" style="margin-top:8px;">Excel 格式：四個工作表整合在同一個檔案，含凍結欄列</div>
    <!-- H. PDF 模式 -->
    <div style="margin-top:12px;">
      <div style="font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:6px;">PDF 薪資明細模式</div>
      <div class="pdf-mode-row">
        <button class="format-btn active" id="pdf-simple" onclick="setPdfMode('simple')">📄 精簡版</button>
        <button class="format-btn" id="pdf-full" onclick="setPdfMode('full')">📋 完整版</button>
      </div>
      <div class="hint" id="pdf-mode-hint" style="margin-top:6px;">精簡版：僅顯示姓名・應發・實發・公司勞退・人事成本</div>
    </div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:0;">
    <button class="export-btn" id="exportBtn" onclick="startExport()" style="flex:1;">
      <span>⬇️</span><span id="exportBtnText">Excel 匯出</span>
    </button>
    <button class="export-btn" id="pdfBtn" onclick="startPdfPreview()" style="flex:1;background:linear-gradient(135deg,#9334e6,#6a1bb5);box-shadow:0 4px 16px rgba(147,52,230,.35);">
      <span>🖨️</span><span>預覽 PDF</span>
    </button>
  </div>

  <!-- PDF 預覽 Modal -->
  <div id="pdfModal" style="display:none;position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,0.7);flex-direction:column;">
    <div style="background:white;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,0.2);">
      <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;">
        <div style="font-size:15px;font-weight:900;flex:1;">🖨️ PDF 預覽</div>
        <button onclick="window.print()" style="background:#9334e6;color:white;border:none;border-radius:10px;padding:8px 18px;font-size:14px;font-weight:800;cursor:pointer;">列印 / 存 PDF</button>
        <button onclick="closePdfModal()" style="background:#f1f3f4;border:none;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;">✕ 關閉</button>
      </div>
      <!-- I. 欄位勾選（完整版才顯示） -->
      <div class="col-toggle-wrap" id="colToggleWrap" style="display:none;">
        <div class="col-toggle-title">顯示欄位（可選）</div>
        <div class="col-toggle-grid">
          <label class="col-toggle-item"><input type="checkbox" id="col-laborAllow" checked onchange="rerenderPdfSalaryPage()"> 勞務津貼</label>
          <label class="col-toggle-item"><input type="checkbox" id="col-perf" checked onchange="rerenderPdfSalaryPage()"> 績效獎金</label>
          <label class="col-toggle-item"><input type="checkbox" id="col-other" checked onchange="rerenderPdfSalaryPage()"> 其他津貼</label>
          <label class="col-toggle-item"><input type="checkbox" id="col-holiday" checked onchange="rerenderPdfSalaryPage()"> 假日結算</label>
        </div>
      </div>
    </div>
    <div id="pdfPreviewBody" style="flex:1;overflow-y:auto;padding:20px;background:#e5e7eb;"></div>
  </div>

  <div class="progress-area" id="progressArea">
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">準備中...</div>
    <div class="progress-log" id="progressLog"></div>
  </div>

  <div class="summary-card" id="summaryCard">
    <div class="summary-title">✅ 匯出完成</div>
    <div class="summary-grid">
      <div class="summary-item"><div class="summary-num" id="sum-emp">0</div><div class="summary-label">員工人數</div></div>
      <div class="summary-item"><div class="summary-num" id="sum-leave">0</div><div class="summary-label">特補休筆數</div></div>
      <div class="summary-item"><div class="summary-num" id="sum-salary">0</div><div class="summary-label">薪資記錄筆數</div></div>
      <div class="summary-item"><div class="summary-num" id="sum-cost">0</div><div class="summary-label">全店人事成本</div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="export-page.js"></script>
</body>
</html>

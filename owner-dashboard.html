<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="莉學商行">
<link rel="apple-touch-icon" href="icon-192.svg">
<meta name="theme-color" content="#7c3aed">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>👑 加盟主決策儀表板</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>
<script src="firebase-init.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--primary:#7c3aed;--primary-dark:#5b21b6;--accent:#34a853;--danger:#d93025;--warn:#e67e22;
  --bg:#f4f6fb;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--header-h:56px;}
html,body{height:100%;background:var(--bg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text);overscroll-behavior-x:none;}
#loadingOverlay{display:flex;position:fixed;inset:0;background:linear-gradient(135deg,#7c3aed,#5b21b6);z-index:99999;flex-direction:column;justify-content:center;align-items:center;color:#fff;transition:opacity .4s;}
#loadingOverlay.hidden{opacity:0;pointer-events:none;}
.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:0 14px;height:var(--header-h);display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px rgba(124,58,237,.3);position:sticky;top:0;z-index:100;}
.header-back{background:rgba(255,255,255,.18);border:none;color:#fff;height:34px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;padding:0 12px;white-space:nowrap;}
.header-title{font-size:17px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.msel{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:5px 8px;font-size:13px;font-weight:700;}
.msel option{color:#000;}
.content{padding:14px 12px 90px;max-width:680px;margin:0 auto;}
.sec-title{font-size:13px;font-weight:900;color:var(--text);margin:20px 4px 10px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.sec-title:first-child{margin-top:4px;}
.sec-sub{font-size:11px;color:var(--muted);font-weight:600;margin-left:auto;}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:15px;margin-bottom:10px;}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.kpi{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:13px 15px;}
.kpi-label{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px;}
.kpi-val{font-size:22px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums;}
.kpi-yoy{font-size:11.5px;font-weight:800;margin-top:5px;}
.up{color:#137333;}.down{color:#c5221f;}.flat{color:var(--muted);}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap;}
.tbl th{color:var(--muted);font-size:11px;font-weight:800;padding:5px 6px;text-align:right;border-bottom:1.5px solid var(--border);}
.tbl th:first-child{text-align:left;}
.tbl td{padding:7px 6px;text-align:right;font-weight:700;border-bottom:1px solid #f1f5f9;}
.tbl td:first-child{text-align:left;font-weight:900;}
.medal{font-size:13px;}
.rank1{background:#fffbeb;}
.dim-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px dashed #eef1f4;}
.dim-row:first-child{border-top:none;}
.dim-ic{font-size:20px;width:26px;text-align:center;}
.dim-body{flex:1;min-width:0;}
.dim-name{font-size:13px;font-weight:800;}
.dim-sub{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.5;}
.alert{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:12.5px;font-weight:700;line-height:1.5;}
.a-red{background:#fce8e6;color:#c5221f;}
.a-warn{background:#fff3e0;color:#c0620f;}
.a-ok{background:#e6f4ea;color:#137333;}
.link-row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:13px 15px;margin-bottom:9px;cursor:pointer;}
.link-ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;}
.link-t{flex:1;}
.link-lbl{font-size:14px;font-weight:800;}
.link-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
.link-arr{color:#cbd5e1;font-size:18px;}
.scroll{overflow-x:auto;overscroll-behavior-x:contain;}
.empty{text-align:center;padding:24px;color:var(--muted);font-size:13px;}
.note{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:10px;padding:9px 12px;font-size:11.5px;line-height:1.6;color:#5b21b6;margin-top:8px;}
.review-body h2{font-size:16px;font-weight:900;margin:14px 0 6px;}
.review-body h3{font-size:14px;font-weight:900;margin:12px 0 5px;}
.review-body h4{font-size:13px;font-weight:800;margin:9px 0 4px;}
.review-body p{font-size:13px;line-height:1.75;margin:5px 0;color:#334155;}
.review-body ul{margin:5px 0 5px 18px;}
.review-body li{font-size:13px;line-height:1.7;color:#334155;}
.review-body hr{border:none;border-top:1px dashed #e2e8f0;margin:12px 0;}
.review-body b{color:#0f172a;}
.mini-btn{background:#eef2ff;color:#4338ca;border:none;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;}
</style>
</head>
<body>
<div id="loadingOverlay"><div class="spinner"></div><div>載入中…</div></div>
<div class="header">
  <button class="header-back" onclick="window.location.href='home.html'">← 首頁</button>
  <div class="header-title">👑 加盟主決策儀表板</div>
  <select class="msel" id="monthSel" onchange="renderAll(this.value)"></select>
</div>
<div class="content" id="content"><div class="empty">載入中…</div></div>
<script src="owner-dashboard-page.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="莉學商行">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#e67e22">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🗓️ 我的出勤</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="firebase-init.js"></script>
<script src="shift-utils.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--primary:#e67e22;--primary-dark:#c0620f;--accent:#34a853;--danger:#d93025;--warn:#f9ab00;--bg:#f4f6fb;--text:#1e293b;--text-muted:#64748b;--border:#e2e8f0;--header-h:56px;}
html,body{height:100%;background:var(--bg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text);}
#loadingOverlay{display:flex;position:fixed;inset:0;background:linear-gradient(135deg,#e67e22,#c0620f);z-index:99999;flex-direction:column;justify-content:center;align-items:center;color:#fff;transition:opacity .4s;}
#loadingOverlay.hidden{opacity:0;pointer-events:none;}
.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:0 14px;height:var(--header-h);display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;}
.header-back{background:rgba(255,255,255,.18);border:none;color:#fff;height:34px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;padding:0 12px;white-space:nowrap;}
.header-title{font-size:17px;font-weight:800;flex:1;}
.wrap{max-width:560px;margin:0 auto;padding:14px;}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;}
.bar input{padding:9px 10px;border:1.5px solid var(--border);border-radius:10px;font-weight:700;font-size:14px;background:#fff;}
.daycard{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:12px 14px;margin-bottom:10px;}
.dayhdr{font-size:14px;font-weight:900;margin-bottom:6px;}
.prow{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;border-top:1px dashed #eef1f4;}
.prow:first-of-type{border-top:none;}
.ptag{font-size:11px;font-weight:900;border-radius:6px;padding:2px 7px;white-space:nowrap;}
.tag-in{background:#e6f4ea;color:#137333;}.tag-out{background:#fce8e6;color:#c5221f;}.tag-visit{background:#e3f2fd;color:#1565c0;}
.pstat{margin-left:auto;font-size:12px;font-weight:800;}
.s-ok{color:#137333;}.s-warn{color:#f9ab00;}.s-bad{color:#d93025;}.s-visit{color:#1565c0;}
.meta{font-size:11px;color:var(--text-muted);}
.empty{text-align:center;color:var(--text-muted);padding:40px 12px;}
.maint{text-align:center;padding:40px 20px;}
</style>
</head>
<body>
<div id="loadingOverlay"><div class="spinner"></div><div id="loadingText">載入中…</div></div>
<div class="header">
  <button class="header-back" onclick="window.location.href='home.html'">← 首頁</button>
  <div class="header-title">🗓️ 我的出勤</div>
</div>
<div class="wrap" id="wrap"></div>
<script>
let currentUser=null, appConfig={}, curMonth='';
function showLoading(t){document.getElementById('loadingText').textContent=t||'載入中…';document.getElementById('loadingOverlay').classList.remove('hidden');}
function hideLoading(){document.getElementById('loadingOverlay').classList.add('hidden');}
function canClock(stage,perm){ if(stage==='all')return true; if(stage==='manager')return['manager','owner','admin'].includes(perm); if(stage==='admin')return perm==='admin'; return false; }
function fmtT(iso){ if(!iso)return''; const d=new Date(iso); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function curYm(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}

window.onload=async()=>{
  showLoading('驗證登入…');
  const saved=localStorage.getItem('currentUser')||sessionStorage.getItem('currentUser');
  if(!saved){location.replace('home.html');return;}
  try{currentUser=JSON.parse(saved);}catch(e){location.replace('home.html');return;}
  if(currentUser && currentUser.resigned){ location.replace('my-salary.html'); return; }
  const fb=await new Promise(r=>{const u=firebase.auth().onAuthStateChanged(x=>{u();r(x);});});
  if(!fb){localStorage.removeItem('currentUser');location.replace('home.html');return;}
  try{const s=await window.db.collection('settings').doc('globalConfig').get();if(s.exists)appConfig=s.data();}catch(e){}
  const stage=(appConfig.clockIn||{}).stage||'off';
  // 全面開放(all)時，本店未由店長勾選啟用 → 我的出勤同樣顯示尚未開放
  const storeOn = stage!=='all' || (((appConfig.clockIn||{}).enabledByStore||{})[currentUser.store]===true);
  if(!canClock(stage,currentUser.permission) || !storeOn){
    document.getElementById('wrap').innerHTML='<div class="daycard maint"><div style="font-size:52px;margin-bottom:14px;">🚧</div><div style="font-size:20px;font-weight:900;margin-bottom:8px;">尚未開放</div><div style="color:var(--text-muted);">本店打卡功能尚未開啟。</div></div>';
    hideLoading(); return;
  }
  curMonth=curYm();
  document.getElementById('wrap').innerHTML=`<div class="bar"><span style="font-weight:800;">📅 月份</span><input type="month" id="ymSel" value="${curMonth}" onchange="curMonth=this.value;load();">
    <button onclick="openReqModal()" title="沒排班卻到場、打卡時間打錯、系統問題等" style="margin-left:auto;background:#eef2f7;color:#475569;border:none;border-radius:10px;padding:9px 12px;font-weight:800;font-size:13px;cursor:pointer;">其他情況補登／修改</button>
  </div>
  <div id="reqModal" style="display:none;position:fixed;inset:0;background:rgba(30,41,59,.6);z-index:9000;justify-content:center;align-items:center;padding:20px;">
    <div style="background:#fff;border-radius:16px;padding:18px;max-width:400px;width:100%;">
      <div style="font-size:17px;font-weight:900;margin-bottom:14px;">補登／修改打卡申請</div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;line-height:1.6;">送出後需店長審核（有開推播會通知你結果）。若該日已有同類打卡＝申請修改時間；沒有＝補登。</div>
      <label style="font-size:13px;font-weight:700;">門市</label>
      <select id="rqStore" style="width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;margin:4px 0 4px;"></select>
      <div id="rqStoreHint" style="font-size:12px;color:var(--text-muted);margin:0 0 10px;line-height:1.5;"></div>
      <label style="font-size:13px;font-weight:700;">日期</label>
      <input type="date" id="rqDate" onchange="syncReqStore()" style="width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;margin:4px 0 10px;">
      <label style="font-size:13px;font-weight:700;">打卡類型</label>
      <select id="rqType" style="width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;margin:4px 0 10px;"><option>上班</option><option>下班</option></select>
      <label style="font-size:13px;font-weight:700;">時間</label>
      <input type="time" id="rqTime" style="width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;margin:4px 0 10px;">
      <label style="font-size:13px;font-weight:700;">原因（必選）</label>
      <select id="rqReasonCode" onchange="onReqReasonChange()" style="width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;margin:4px 0 8px;">
        <option value="">請選擇原因…</option>
        <option value="forgot">忘記打卡</option>
        <option value="device">手機沒帶／沒電／故障</option>
        <option value="system">打不進去（定位抓不到、系統出錯）</option>
        <option value="support">支援他店，不知道在哪打卡</option>
        <option value="noshift">沒排班但有到場（臨時支援／加班）</option>
        <option value="wrongtime">打卡時間錯誤，要修改</option>
        <option value="other">其他（請說明）</option>
      </select>
      <div id="rqReasonHint" style="display:none;font-size:12px;line-height:1.6;background:#eef4ff;color:#1557b0;border-radius:8px;padding:8px 10px;margin:0 0 8px;"></div>
      <textarea id="rqReason" rows="2" placeholder="補充說明（選填）" style="width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;margin:0 0 12px;font-family:inherit;"></textarea>
      <div style="display:flex;gap:8px;">
        <button onclick="document.getElementById('reqModal').style.display='none'" style="flex:1;padding:11px;background:#eef1f4;border:none;border-radius:10px;font-weight:700;cursor:pointer;">取消</button>
        <button onclick="submitReq()" style="flex:1;padding:11px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-weight:800;cursor:pointer;">送出申請</button>
      </div>
    </div>
  </div>
  <div id="list"><div class="empty">載入中…</div></div>`;
  await load();
  hideLoading();
};

// 從待補單開啟：日期、門市、缺哪一張都帶好，建議時間用班別的起訖，員工只要確認時間並選原因
async function openFixModal(store, date, shift, punchType){
  openReqModal();
  document.getElementById('rqStore').value=store;
  document.getElementById('rqDate').value=date;
  document.getElementById('rqType').value=punchType;
  const segs=(typeof parseShiftSegs==='function')?parseShiftSegs(shift||''):[];
  if(segs.length){
    const h = punchType==='下班' ? segs[segs.length-1].endH : segs[0].startH;
    const hh=((Math.floor(h)%24)+24)%24, mm=Math.round((h-Math.floor(h))*60);
    document.getElementById('rqTime').value=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  }
  const hint=document.getElementById('rqStoreHint');
  if(hint) hint.innerHTML=`✅ 系統偵測到 <b>${date} ${shift||''}</b> 缺${punchType}卡，已帶好門市與時間<br><span style="color:#c0620f;">請確認時間是否為你<b>實際</b>上下班的時間</span>`;
  await syncReqStore();
  document.getElementById('rqStore').value=store;
  document.getElementById('rqDate').value=date;
  document.getElementById('rqType').value=punchType;
}

function openReqModal(){
  const stores=(appConfig.stores||[]).filter(s=>s!=='人力支援');
  const sel=document.getElementById('rqStore');
  sel.innerHTML=stores.map(s=>`<option value="${s}"${s===currentUser.store?' selected':''}>${s}</option>`).join('');
  const d=new Date();   // ⚠️ 不可用 toISOString()：那是 UTC，台灣 00:00~08:00 會變成「昨天」
  document.getElementById('rqDate').value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  document.getElementById('rqTime').value=''; document.getElementById('rqReason').value='';
  document.getElementById('rqReasonCode').value=''; onReqReasonChange();
  document.getElementById('reqModal').style.display='flex';
  syncReqStore();
}
// 門市預設值跟著「那天的排班」走（同 clock.html）：支援日的班在別家店，
// 照舊的「本店」預設送出去就會送錯店 → 缺卡單配不到、工時也配不起來。
var _rqShifts=[];   // 當天排班（供「自述準時」判定用）
async function syncReqStore(){
  const hint=document.getElementById('rqStoreHint'); if(!hint) return;
  const ds=document.getElementById('rqDate').value;
  const sel=document.getElementById('rqStore');
  if(!ds){ hint.textContent=''; return; }
  hint.textContent='查詢當天排班中…';
  try{
    const hits=await findShiftStoresOn(ds, currentUser.empName, currentUser.store||'', appConfig.stores||[]);
    _rqShifts=hits||[];
    if(!hits.length){ hint.textContent='當天查無排班，門市請自行選擇。'; return; }
    const uniq=[...new Set(hits.map(h=>h.store))];
    if(uniq.length===1) sel.value=uniq[0];
    const txt=hits.map(h=>`${h.store} ${h.shift}${h.fromPrevDay?'（前一日跨夜班）':''}`).join('、');
    hint.innerHTML=uniq.length===1
      ? `✅ 當天排班：<b>${txt}</b>　已自動選好門市`
      : `⚠️ 當天在多家店有班：<b>${txt}</b>　請自行確認要補哪一家`;
  }catch(e){ hint.textContent='（查不到當天排班，門市請自行確認）'; }
}
// ===== 補登原因分類（2026-09-16）=====
// 原本是選填的自由輸入 → 8/1~9/16 的 321 張申請有 189 張（59%）空白，店長看到「原因：—」、也無從統計根因。
// 改成必選分類（選「其他」才強制打字），並另存 reasonCode/reasonText 供統計；reason 仍組成文字供既有顯示與通知使用。
var REQ_REASONS={forgot:'忘記打卡', device:'手機沒帶／沒電／故障', system:'打不進去（定位或系統出錯）', support:'支援他店，不知道在哪打卡', noshift:'沒排班但有到場', wrongtime:'打卡時間錯誤，要修改', other:'其他'};
var REQ_REASON_HINTS={
  system:'若你還在店裡，請先回打卡頁按「📨 傳送給系統管理員」附上定位診斷，這樣才查得出原因。',
  support:'提醒：支援他店時，要在<b>實際上班的那家店</b>打卡，門市請選那一家。',
  wrongtime:'這是「修改時間」：填正確時間即可，原本的打卡紀錄會保留備查。',
  noshift:'沒排班卻有到場，請順便提醒店長補排班，否則工時可能算不進去。',
  other:'請具體說明原因（至少 5 個字），店長才有辦法判斷。'
};
function onReqReasonChange(){
  var code=document.getElementById('rqReasonCode').value;
  var hint=document.getElementById('rqReasonHint');
  var ta=document.getElementById('rqReason');
  if(hint){ hint.innerHTML=REQ_REASON_HINTS[code]||''; hint.style.display=REQ_REASON_HINTS[code]?'block':'none'; }
  if(ta) ta.placeholder = code==='other' ? '請說明原因（必填，至少 5 個字）' : '補充說明（選填）';
}
// 薪資送審後鎖定（2026-09-16 使用者定案）：該月薪資 submitted/published 後員工不能自行補登，改由店長代補（會留記號）
async function salaryLockedFor(store, ym){
  try{
    const d=await window.db.collection('stores').doc(store).collection('salary').doc(ym).get();
    const st=d.exists ? (d.data().status||'draft') : 'draft';
    return ['submitted','published'].includes(st);
  }catch(e){ return false; }   // 查不到就不擋，避免連線問題讓人補不了卡
}
// 回傳 null＝驗證未過（已提示使用者）
function collectReqReason(){
  var code=document.getElementById('rqReasonCode').value;
  var text=document.getElementById('rqReason').value.trim();
  if(!code){ alert('請選擇原因'); return null; }
  if(code==='other' && text.length<5){ alert('選「其他」時請具體說明原因（至少 5 個字）'); return null; }
  return { reasonCode:code, reasonText:text, reason:REQ_REASONS[code]+(text?'：'+text:'') };
}
async function submitReq(){
  const atStore=document.getElementById('rqStore').value;
  const targetDate=document.getElementById('rqDate').value;
  const punchType=document.getElementById('rqType').value;
  const requestedTime=document.getElementById('rqTime').value;
  if(!atStore||!targetDate||!requestedTime){ alert('請填寫門市、日期、時間'); return; }
  const rr=collectReqReason(); if(!rr) return;
  // 自述準時（2026-09-16）：補上班卡且申報時間落在排班開始 ±5 分鐘內 → 標記。
  // 系統無從查證員工幾點到店，能做的是讓「每次都剛好準時」這件事在店長眼前看得見。
  let claimOnTime=false;
  try{
    if(punchType==='上班'){
      const hit=(_rqShifts||[]).find(h=>h.store===atStore) || (_rqShifts||[])[0];
      const segs=(hit && typeof parseShiftSegs==='function') ? parseShiftSegs(hit.shift||'') : [];
      if(segs.length){
        const startMin=Math.round(segs[0].startH*60);
        const [hh,mm]=requestedTime.split(':').map(Number);
        claimOnTime = Math.abs((hh*60+mm) - startMin) <= 5;
      }
    }
  }catch(e){}
  if(await salaryLockedFor(atStore, targetDate.slice(0,7))){
    alert(`${targetDate.slice(0,7)} 的薪資已送審，無法自行補登。\n請聯絡店長協助補登（店長端仍可代補）。`);
    return;
  }
  showLoading('送出中…');
  try{
    await window.db.collection('stores').doc(atStore).collection('attendanceRequests').add({
      empName:currentUser.empName, displayName:currentUser.displayName||currentUser.empName,
      homeStore:currentUser.store||'', atStore, type:'補登/修改', targetDate, punchType, requestedTime,
      reason:rr.reason, reasonCode:rr.reasonCode, reasonText:rr.reasonText, claimOnTime,
      status:'pending', createdAt:new Date().toISOString(), createdBy:currentUser.empName
    });
    hideLoading();
    document.getElementById('reqModal').style.display='none';
    alert('✅ 已送出申請，等待店長審核（結果會 LINE 通知你）');
  }catch(e){ hideLoading(); alert('送出失敗：'+e.message); }
}
async function load(){
  const list=document.getElementById('list'); if(list) list.innerHTML='<div class="empty">載入中…</div>';
  const me=currentUser.empName;
  const stores=(appConfig.stores||[]).filter(s=>s!=='人力支援');
  let recs=[], reqs=[];
  try{
    await Promise.all(stores.map(async st=>{
      const [aSnap,rSnap]=await Promise.all([
        window.db.collection('stores').doc(st).collection('attendance').where('empName','==',me).get().catch(()=>null),
        window.db.collection('stores').doc(st).collection('attendanceRequests').where('empName','==',me).get().catch(()=>null)
      ]);
      if(aSnap) aSnap.forEach(d=>{ const r={id:d.id,_store:st,...d.data()}; if(String(r.shiftDate||r.date||'').startsWith(curMonth)) recs.push(r); });
      // 依月份過濾，與上方的打卡紀錄一致（不然會一直累積、只看得到最近 10 筆）
      // 以 targetDate（要更正的那一天）為準，缺漏才退回 createdAt
      if(rSnap) rSnap.forEach(d=>{ const r={id:d.id,_store:st,...d.data()};
        if(String(r.targetDate||r.createdAt||'').startsWith(curMonth)) reqs.push(r); });
    }));
  }catch(e){ if(list) list.innerHTML=`<div class="empty">讀取失敗：${e.message}</div>`; return; }
  // ===== 系統開給你的待補單（2026-09-16）=====
  // 缺卡由排程判定後自動成立一張待補單並推播；員工只要填時間與原因，不必自己從頭找日期／班別。
  // 已經送出（待審或已核准）的就不再列，避免重複補同一張。
  const submitted=new Set(reqs.filter(q=>q.status!=='rejected').map(q=>`${q.targetDate}|${q.punchType}`));
  const missTypes=(note)=>String(note||'').includes('下班') ? ['下班'] : String(note||'').includes('上班') ? ['上班'] : ['上班','下班'];
  const todo=[];
  recs.filter(r=>!r.voided && (r.status==='缺卡'||r.type==='缺卡')).forEach(r=>{
    missTypes(r.note).forEach(t=>{ if(!submitted.has(`${r.date}|${t}`)) todo.push({store:r._store, date:r.date, shift:r.shift||'', punchType:t, note:r.note||'缺卡'}); });
  });
  todo.sort((a,b)=>a.date.localeCompare(b.date));
  let todoHtml='';
  if(todo.length){
    todoHtml=`<div class="daycard" style="border:1.5px solid #f5c2bd;background:#fff5f5;"><div class="dayhdr" style="color:#b3261e;">🔴 待補打卡（${todo.length}）<span style="font-size:11px;font-weight:600;color:var(--text-muted);margin-left:6px;">系統偵測到缺卡，填時間與原因即可送出</span></div>`+
      todo.map(t=>`<div class="prow"><span class="meta" style="flex:1;font-weight:700;color:var(--text);">${t.date}　${t.shift||'—'}　缺${t.punchType}卡　@${t.store}</span>
        <button onclick="openFixModal('${t.store}','${t.date}','${t.shift}','${t.punchType}')" style="background:var(--primary);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-weight:800;font-size:12px;cursor:pointer;">補登</button></div>`).join('')+`</div>`;
  }
  // 我的補登/修改申請（近期＋狀態）
  let reqHtml='';
  if(reqs.length){
    reqs.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
    reqHtml=`<div class="daycard" style="border:1.5px solid #cfe2ff;background:#f2f8ff;"><div class="dayhdr" style="color:#0369a1;">📝 我的補登/修改申請<span style="font-size:11px;font-weight:600;color:var(--text-muted);margin-left:6px;">${curMonth.replace('-','年')}月 · ${reqs.length} 筆</span></div>`+
      reqs.map(q=>{
        const sc=q.status==='approved'?'s-ok':q.status==='rejected'?'s-bad':'s-warn';
        const stt=q.status==='approved'?'✅ 已核准':q.status==='rejected'?`❌ 已駁回${q.reviewNote?'：'+q.reviewNote:''}`:'⏳ 待審核';
        return `<div class="prow"><span class="meta" style="flex:1;font-weight:700;color:var(--text);">${q.targetDate} ${q.punchType} ${q.requestedTime} @${q.atStore}</span><span class="pstat ${sc}">${stt}</span></div>`;
      }).join('')+`</div>`;
  }
  if(!recs.length){ if(list) list.innerHTML=todoHtml+reqHtml+'<div class="empty">這個月尚無打卡紀錄</div>'; return; }
  recs.sort((a,b)=>(b.deviceTs||b.date||'').localeCompare(a.deviceTs||a.date||''));
  const byDate={};
  recs.forEach(r=>{ const k=r.shiftDate||r.date; (byDate[k]=byDate[k]||[]).push(r); });
  const dates=Object.keys(byDate).sort().reverse();
  let html='';
  dates.forEach(dt=>{
    const ps=byDate[dt].sort((a,b)=>(a.deviceTs||'').localeCompare(b.deviceTs||''));
    const [y,m,d]=dt.split('-');
    const wd=['日','一','二','三','四','五','六'][new Date(+y,+m-1,+d).getDay()];
    html+=`<div class="daycard"><div class="dayhdr">${+m}/${+d}（${wd}）</div>`;
    ps.forEach(r=>{
      const tag=r.type==='上班'?'tag-in':r.type==='下班'?'tag-out':'tag-visit';
      const sc=r.status==='遲到'||r.status==='早退'?'s-bad':r.status==='警告'?'s-warn':r.status==='到場'?'s-visit':r.status==='缺卡'?'s-bad':'s-ok';
      const st=r.status==='遲到'?`遲到 ${r.lateMin||''} 分`:r.status==='警告'?`遲到 ${r.lateMin||''} 分(容許內)`:r.status||'';
      const time=fmtT(r.deviceTs);
      const srcTag = r.source==='manual'?'<span style="font-size:11px;color:#8a5cf6;font-weight:800;"> ·補登</span>'
        : r.source==='offline'?'<span style="font-size:11px;color:#e67e22;font-weight:800;"> ·📴離線</span>'
        : r.source==='system'?'<span style="font-size:11px;color:#d93025;font-weight:800;"> ·系統</span>':'';
      const needRev = r.source==='offline' && r.needReview;
      html+=`<div class="prow"><span class="ptag ${tag}">${r.type}</span><span style="font-weight:800;">${time}</span><span class="meta">@${r.atStore}${r.shift?` · 班 ${r.shift}`:''}${srcTag}</span><span class="pstat ${needRev?'s-warn':sc}">${needRev?'離線待核':st}</span></div>`;
      html+=`<div style="display:flex;align-items:center;gap:6px;padding:0 0 6px 4px;">
        <span class="meta" style="flex:1;">${r.empNote?(`<span style="color:#c0620f;">🗣️ ${r.empNote}</span>`+(r.note?`<br>💬 ${r.note}`:'')):(r.note?('💬 '+r.note):'<span style="color:#cbd5e1;">（可加備註說明，如忘記打卡實際時間）</span>')}</span>
        <button onclick="editNote('${r._store}','${r.id}')" style="background:#eef2ff;color:#4338ca;border:none;border-radius:6px;padding:3px 9px;font-size:11px;font-weight:800;cursor:pointer;">💬 備註</button>
      </div>`;
      if(r.otStatus==='pending') html+=`<div class="meta" style="padding:0 0 6px 4px;color:#c0620f;">📝 加班申請待店長審核：${r.otContent||''}</div>`;
      else if(r.otStatus==='approved') html+=`<div class="meta" style="padding:0 0 6px 4px;color:#137333;font-weight:700;">✅ 加班已核准（計工時）</div>`;
      else if(r.otStatus==='rejected') html+=`<div class="meta" style="padding:0 0 6px 4px;color:#94a3b8;">❌ 加班未准${r.otReason?'：'+r.otReason:''}（不計工時）</div>`;
      else if(r.otStatus==='private') html+=`<div class="meta" style="padding:0 0 6px 4px;color:#64748b;">🅿️ 不計工時（非加班／私事）${r.otContent?`・${r.otContent}`:''}</div>`;
    });
    html+=`</div>`;
  });
  const mh=calcMonthHours(recs);
  const sumHtml=`<div class="daycard" style="border:1.5px solid #b7e4c7;background:#f0fbf4;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <div><div style="font-size:12.5px;color:#137333;font-weight:900;">本月累計有效工時（截至今日）</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:3px;line-height:1.5;">以排班時數為基準（超時封頂）、核准加班才加、到場/私事不計${mh.openCnt?`；另有 ${mh.openCnt} 筆上班未打下班暫不計入`:''}</div></div>
      <div style="font-size:27px;font-weight:900;color:#137333;white-space:nowrap;">${mh.hours.toFixed(1)}<span style="font-size:13px;font-weight:700;">h</span></div>
    </div></div>`;
  if(list) list.innerHTML=todoHtml+reqHtml+sumHtml+html;
}
// 本月有效工時：以排班時數為基準(超時封頂)、核准加班才加、到場/私事不計；配對上下班、跨日自動接續、排除缺卡/註銷
function schedHours(sh){ return shiftTotalHours(sh); }   // 見 shift-utils.js（支援半點班／兩頭班）
function calcMonthHours(recs){
  const pts=recs.filter(r=>(r.type==='上班'||r.type==='下班') && r.status!=='缺卡' && !r.voided)
    .map(r=>({type:r.type, t:(typeof r.tsMs==='number'?r.tsMs:Date.parse(r.deviceTs||r.date||'')), shift:r.shift||'', ot:r.otStatus||null}))
    .filter(r=>isFinite(r.t)).sort((a,b)=>a.t-b.t);
  let hours=0, openIn=null, dangling=0;
  pts.forEach(p=>{
    if(p.type==='上班'){ if(openIn) dangling++; openIn=p; }
    else if(openIn){
      const actual=(p.t-openIn.t)/3600000;
      if(actual>0){
        const otApproved = openIn.ot==='approved' || p.ot==='approved';
        const sched = schedHours(openIn.shift||p.shift);
        hours += sched>0 ? (otApproved?actual:Math.min(actual,sched)) : (otApproved?actual:0);
      }
      openIn=null;
    }
  });
  if(openIn) dangling++;
  return { hours, openCnt: dangling };
}
async function editNote(store,id){
  const ref=window.db.collection('stores').doc(store).collection('attendance').doc(id);
  let cur={}; try{ cur=(await ref.get()).data()||{}; }catch(e){}
  const note=prompt('打卡備註（例：忘記打卡，實際 9:00 到）：', cur.note||'');
  if(note===null) return;
  showLoading('儲存中…');
  try{ await ref.set({ note, noteBy:currentUser.empName }, {merge:true}); hideLoading(); load(); }
  catch(e){ hideLoading(); alert('儲存失敗：'+e.message); }
}

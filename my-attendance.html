<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="莉學商行">
<link rel="apple-touch-icon" href="icon-192.svg">
<meta name="theme-color" content="#e67e22">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🗓️ 我的出勤</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="firebase-init.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--primary:#e67e22;--primary-dark:#c0620f;--accent:#34a853;--danger:#d93025;--warn:#f9ab00;--bg:#f4f6fb;--text:#1e293b;--text-muted:#64748b;--border:#e2e8f0;--header-h:56px;}
html,body{height:100%;background:var(--bg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text);}
#loadingOverlay{display:flex;position:fixed;inset:0;background:linear-gradient(135deg,#e67e22,#c0620f);z-index:99999;flex-direction:column;justify-content:center;align-items:center;color:#fff;transition:opacity .4s;}
#loadingOverlay.hidden{opacity:0;pointer-events:none;}
.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:0 14px;height:var(--header-h);display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;}
.header-back{background:rgba(255,255,255,.18);border:none;color:#fff;height:34px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;padding:0 12px;white-space:nowrap;}
.header-title{font-size:17px;font-weight:800;flex:1;}
.wrap{max-width:560px;margin:0 auto;padding:14px;}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;}
.bar input{padding:9px 10px;border:1.5px solid var(--border);border-radius:10px;font-weight:700;font-size:14px;background:#fff;}
.daycard{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:12px 14px;margin-bottom:10px;}
.dayhdr{font-size:14px;font-weight:900;margin-bottom:6px;}
.prow{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;border-top:1px dashed #eef1f4;}
.prow:first-of-type{border-top:none;}
.ptag{font-size:11px;font-weight:900;border-radius:6px;padding:2px 7px;white-space:nowrap;}
.tag-in{background:#e6f4ea;color:#137333;}.tag-out{background:#fce8e6;color:#c5221f;}.tag-visit{background:#e3f2fd;color:#1565c0;}
.pstat{margin-left:auto;font-size:12px;font-weight:800;}
.s-ok{color:#137333;}.s-warn{color:#f9ab00;}.s-bad{color:#d93025;}.s-visit{color:#1565c0;}
.meta{font-size:11px;color:var(--text-muted);}
.empty{text-align:center;color:var(--text-muted);padding:40px 12px;}
.maint{text-align:center;padding:40px 20px;}
</style>
</head>
<body>
<div id="loadingOverlay"><div class="spinner"></div><div id="loadingText">載入中…</div></div>
<div class="header">
  <button class="header-back" onclick="window.location.href='home.html'">← 首頁</button>
  <div class="header-title">🗓️ 我的出勤</div>
</div>
<div class="wrap" id="wrap"></div>
<script>
let currentUser=null, appConfig={}, curMonth='';
function showLoading(t){document.getElementById('loadingText').textContent=t||'載入中…';document.getElementById('loadingOverlay').classList.remove('hidden');}
function hideLoading(){document.getElementById('loadingOverlay').classList.add('hidden');}
function canClock(stage,perm){ if(stage==='all')return true; if(stage==='manager')return['manager','owner','admin'].includes(perm); if(stage==='admin')return perm==='admin'; return false; }
function fmtT(iso){ if(!iso)return''; const d=new Date(iso); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function curYm(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}

window.onload=async()=>{
  showLoading('驗證登入…');
  const saved=localStorage.getItem('currentUser')||sessionStorage.getItem('currentUser');
  if(!saved){location.replace('home.html');return;}
  try{currentUser=JSON.parse(saved);}catch(e){location.replace('home.html');return;}
  const fb=await new Promise(r=>{const u=firebase.auth().onAuthStateChanged(x=>{u();r(x);});});
  if(!fb){localStorage.removeItem('currentUser');location.replace('home.html');return;}
  try{const s=await window.db.collection('settings').doc('globalConfig').get();if(s.exists)appConfig=s.data();}catch(e){}
  const stage=(appConfig.clockIn||{}).stage||'off';
  if(!canClock(stage,currentUser.permission)){
    document.getElementById('wrap').innerHTML='<div class="daycard maint"><div style="font-size:52px;margin-bottom:14px;">🚧</div><div style="font-size:20px;font-weight:900;margin-bottom:8px;">維護中敬請期待</div><div style="color:var(--text-muted);">打卡功能尚未對您開放。</div></div>';
    hideLoading(); return;
  }
  curMonth=curYm();
  document.getElementById('wrap').innerHTML=`<div class="bar"><span style="font-weight:800;">📅 月份</span><input type="month" id="ymSel" value="${curMonth}" onchange="curMonth=this.value;load();">
    <button onclick="openReqModal()" style="margin-left:auto;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:9px 12px;font-weight:800;font-size:13px;cursor:pointer;">＋ 補登/修改申請</button>
  </div>
  <div id="reqModal" style="display:none;position:fixed;inset:0;background:rgba(30,41,59,.6);z-index:9000;justify-content:center;align-items:center;padding:20px;">
    <div style="background:#fff;border-radius:16px;padding:18px;max-width:400px;width:100%;">
      <div style="font-size:17px;font-weight:900;margin-bottom:14px;">補登／修改打卡申請</div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;line-height:1.6;">送出後需店長審核（會 LINE 通知你結果）。若該日已有同類打卡＝申請修改時間；沒有＝補登。</div>
      <label style="font-size:13px;font-weight:700;">門市</label>
      <select id="rqStore" style="width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;margin:4px 0 10px;"></select>
      <label style="font-size:13px;font-weight:700;">日期</label>
      <input type="date" id="rqDate" style="width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;margin:4px 0 10px;">
      <label style="font-size:13px;font-weight:700;">打卡類型</label>
      <select id="rqType" style="width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;margin:4px 0 10px;"><option>上班</option><option>下班</option><option>到場</option><option>離場</option></select>
      <label style="font-size:13px;font-weight:700;">時間</label>
      <input type="time" id="rqTime" style="width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;margin:4px 0 10px;">
      <label style="font-size:13px;font-weight:700;">原因</label>
      <textarea id="rqReason" rows="2" placeholder="例：忘記打卡" style="width:100%;padding:9px;border:1.5px solid var(--border);border-radius:8px;margin:4px 0 12px;"></textarea>
      <div style="display:flex;gap:8px;">
        <button onclick="document.getElementById('reqModal').style.display='none'" style="flex:1;padding:11px;background:#eef1f4;border:none;border-radius:10px;font-weight:700;cursor:pointer;">取消</button>
        <button onclick="submitReq()" style="flex:1;padding:11px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-weight:800;cursor:pointer;">送出申請</button>
      </div>
    </div>
  </div>
  <div id="list"><div class="empty">載入中…</div></div>`;
  await load();
  hideLoading();
};

function openReqModal(){
  const stores=(appConfig.stores||[]).filter(s=>s!=='人力支援');
  const sel=document.getElementById('rqStore');
  sel.innerHTML=stores.map(s=>`<option value="${s}"${s===currentUser.store?' selected':''}>${s}</option>`).join('');
  document.getElementById('rqDate').value=new Date().toISOString().slice(0,10);
  document.getElementById('rqTime').value=''; document.getElementById('rqReason').value='';
  document.getElementById('reqModal').style.display='flex';
}
async function submitReq(){
  const atStore=document.getElementById('rqStore').value;
  const targetDate=document.getElementById('rqDate').value;
  const punchType=document.getElementById('rqType').value;
  const requestedTime=document.getElementById('rqTime').value;
  const reason=document.getElementById('rqReason').value.trim();
  if(!atStore||!targetDate||!requestedTime){ alert('請填寫門市、日期、時間'); return; }
  showLoading('送出中…');
  try{
    await window.db.collection('stores').doc(atStore).collection('attendanceRequests').add({
      empName:currentUser.empName, displayName:currentUser.displayName||currentUser.empName,
      homeStore:currentUser.store||'', atStore, type:'補登/修改', targetDate, punchType, requestedTime,
      reason, status:'pending', createdAt:new Date().toISOString(), createdBy:currentUser.empName
    });
    hideLoading();
    document.getElementById('reqModal').style.display='none';
    alert('✅ 已送出申請，等待店長審核（結果會 LINE 通知你）');
  }catch(e){ hideLoading(); alert('送出失敗：'+e.message); }
}
async function load(){
  const list=document.getElementById('list'); if(list) list.innerHTML='<div class="empty">載入中…</div>';
  const me=currentUser.empName;
  const stores=(appConfig.stores||[]).filter(s=>s!=='人力支援');
  let recs=[], reqs=[];
  try{
    await Promise.all(stores.map(async st=>{
      const [aSnap,rSnap]=await Promise.all([
        window.db.collection('stores').doc(st).collection('attendance').where('empName','==',me).get().catch(()=>null),
        window.db.collection('stores').doc(st).collection('attendanceRequests').where('empName','==',me).get().catch(()=>null)
      ]);
      if(aSnap) aSnap.forEach(d=>{ const r=d.data(); if(String(r.date||'').startsWith(curMonth)) recs.push({id:d.id,_store:st,...r}); });
      if(rSnap) rSnap.forEach(d=>reqs.push({id:d.id,_store:st,...d.data()}));
    }));
  }catch(e){ if(list) list.innerHTML=`<div class="empty">讀取失敗：${e.message}</div>`; return; }
  // 我的補登/修改申請（近期＋狀態）
  let reqHtml='';
  if(reqs.length){
    reqs.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
    reqHtml=`<div class="daycard" style="border:1.5px solid #cfe2ff;background:#f2f8ff;"><div class="dayhdr" style="color:#0369a1;">📝 我的補登/修改申請</div>`+
      reqs.slice(0,10).map(q=>{
        const sc=q.status==='approved'?'s-ok':q.status==='rejected'?'s-bad':'s-warn';
        const stt=q.status==='approved'?'✅ 已核准':q.status==='rejected'?`❌ 已駁回${q.reviewNote?'：'+q.reviewNote:''}`:'⏳ 待審核';
        return `<div class="prow"><span class="meta" style="flex:1;font-weight:700;color:var(--text);">${q.targetDate} ${q.punchType} ${q.requestedTime} @${q.atStore}</span><span class="pstat ${sc}">${stt}</span></div>`;
      }).join('')+`</div>`;
  }
  if(!recs.length){ if(list) list.innerHTML=reqHtml+'<div class="empty">這個月尚無打卡紀錄</div>'; return; }
  recs.sort((a,b)=>(b.deviceTs||b.date||'').localeCompare(a.deviceTs||a.date||''));
  const byDate={};
  recs.forEach(r=>{ (byDate[r.date]=byDate[r.date]||[]).push(r); });
  const dates=Object.keys(byDate).sort().reverse();
  let html='';
  dates.forEach(dt=>{
    const ps=byDate[dt].sort((a,b)=>(a.deviceTs||'').localeCompare(b.deviceTs||''));
    const [y,m,d]=dt.split('-');
    const wd=['日','一','二','三','四','五','六'][new Date(+y,+m-1,+d).getDay()];
    html+=`<div class="daycard"><div class="dayhdr">${+m}/${+d}（${wd}）</div>`;
    ps.forEach(r=>{
      const tag=r.type==='上班'?'tag-in':r.type==='下班'?'tag-out':'tag-visit';
      const sc=r.status==='遲到'||r.status==='早退'?'s-bad':r.status==='警告'?'s-warn':r.status==='到場'?'s-visit':r.status==='缺卡'?'s-bad':'s-ok';
      const st=r.status==='遲到'?`遲到 ${r.lateMin||''} 分`:r.status==='警告'?`遲到 ${r.lateMin||''} 分(容許內)`:r.status||'';
      const time=fmtT(r.deviceTs);
      html+=`<div class="prow"><span class="ptag ${tag}">${r.type}</span><span style="font-weight:800;">${time}</span><span class="meta">@${r.atStore}${r.shift?` · 班 ${r.shift}`:''}</span><span class="pstat ${sc}">${st}</span></div>`;
      html+=`<div style="display:flex;align-items:center;gap:6px;padding:0 0 6px 4px;">
        <span class="meta" style="flex:1;">${r.note?('💬 '+r.note):'<span style="color:#cbd5e1;">（可加備註說明，如忘記打卡實際時間）</span>'}</span>
        <button onclick="editNote('${r._store}','${r.id}')" style="background:#eef2ff;color:#4338ca;border:none;border-radius:6px;padding:3px 9px;font-size:11px;font-weight:800;cursor:pointer;">💬 備註</button>
      </div>`;
    });
    html+=`</div>`;
  });
  if(list) list.innerHTML=reqHtml+html;
}
async function editNote(store,id){
  const ref=window.db.collection('stores').doc(store).collection('attendance').doc(id);
  let cur={}; try{ cur=(await ref.get()).data()||{}; }catch(e){}
  const note=prompt('打卡備註（例：忘記打卡，實際 9:00 到）：', cur.note||'');
  if(note===null) return;
  showLoading('儲存中…');
  try{ await ref.set({ note, noteBy:currentUser.empName }, {merge:true}); hideLoading(); load(); }
  catch(e){ hideLoading(); alert('儲存失敗：'+e.message); }
}
</script>
</body>
</html>

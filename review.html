<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 門市營運檢討</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="firebase-init.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#f4f6fb;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#1e293b;line-height:1.6;padding:16px;}
.wrap{max-width:720px;margin:0 auto;}
.head{background:linear-gradient(135deg,#4338ca,#6d28d9);color:#fff;border-radius:16px;padding:20px 18px;margin-bottom:14px;}
.head h1{font-size:20px;font-weight:900;}
.head .sub{font-size:12.5px;opacity:.9;margin-top:4px;}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 6px rgba(0,0,0,.06);padding:16px;margin-bottom:14px;}
.sec{font-size:13px;font-weight:900;margin:4px 2px 10px;}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.kpi{background:#f8fafc;border-radius:10px;padding:11px 12px;}
.kpi .l{font-size:11px;color:#64748b;font-weight:700;}
.kpi .v{font-size:19px;font-weight:900;margin-top:2px;}
.kpi .y{font-size:11px;font-weight:700;margin-top:2px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid #f1f5f9;white-space:nowrap;}
th{color:#64748b;font-size:11px;font-weight:800;}
th:first-child,td:first-child{text-align:left;}
.scroll{overflow-x:auto;}
.body h2{font-size:16px;font-weight:900;margin:14px 0 6px;}
.body h3{font-size:14px;font-weight:900;margin:12px 0 5px;}
.body h4{font-size:13px;font-weight:800;margin:9px 0 4px;}
.body p{font-size:13.5px;line-height:1.8;margin:5px 0;color:#334155;}
.body ul{margin:5px 0 5px 18px;} .body li{font-size:13.5px;line-height:1.75;color:#334155;margin:2px 0;}
.body hr{border:none;border-top:1px dashed #e2e8f0;margin:14px 0;}
.body b{color:#0f172a;}
.foot{font-size:11px;color:#94a3b8;text-align:center;margin:6px 0 24px;line-height:1.7;}
.msg{text-align:center;padding:60px 20px;color:#64748b;}
.msg .ic{font-size:52px;margin-bottom:14px;}
.msg .t{font-size:19px;font-weight:900;color:#1e293b;margin-bottom:8px;}
.pos{color:#137333;} .neg{color:#c5221f;}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="msg"><div class="ic">⏳</div><div class="t">載入中…</div></div></div>
<script>
const money=v=>Math.round(v||0).toLocaleString('en-US');
const nn=v=>{const x=parseFloat(v);return isFinite(x)?x:null;};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function mdToHtml(md){
  const inl=t=>t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  let html='',inList=false; const cl=()=>{if(inList){html+='</ul>';inList=false;}};
  esc(md).split(/\r?\n/).forEach(raw=>{
    const line=raw.replace(/\s+$/,'');
    if(/^###\s+/.test(line)){cl();html+=`<h4>${inl(line.replace(/^###\s+/,''))}</h4>`;}
    else if(/^##\s+/.test(line)){cl();html+=`<h3>${inl(line.replace(/^##\s+/,''))}</h3>`;}
    else if(/^#\s+/.test(line)){cl();html+=`<h2>${inl(line.replace(/^#\s+/,''))}</h2>`;}
    else if(/^[-*]\s+/.test(line)){if(!inList){html+='<ul>';inList=true;}html+=`<li>${inl(line.replace(/^[-*]\s+/,''))}</li>`;}
    else if(/^---+$/.test(line)){cl();html+='<hr>';}
    else if(line===''){cl();}
    else{cl();html+=`<p>${inl(line)}</p>`;}
  });
  cl(); return html;
}
function msg(ic,t,d){ document.getElementById('wrap').innerHTML=`<div class="msg"><div class="ic">${ic}</div><div class="t">${t}</div><div>${d||''}</div></div>`; }
function fmtYoY(cur){ if(cur==null) return '<span style="color:#94a3b8;">—</span>'; const cls=cur>0?'pos':cur<0?'neg':''; const ar=cur>0?'▲':cur<0?'▼':''; return `<span class="${cls}">${ar} ${cur>0?'+':''}${money(cur)}</span>`; }

(async()=>{
  const t=new URLSearchParams(location.search).get('t');
  if(!t){ msg('🔗','連結無效','缺少分享參數'); return; }
  let d=null;
  try{ const s=await window.db.collection('sharedReviews').doc(t).get(); if(s.exists) d=s.data(); }
  catch(e){ msg('⏰','連結已失效','此分享連結已超過 3 天有效期，或已被移除。請向加盟主索取新連結。'); return; }
  if(!d){ msg('🔗','找不到報告','連結不存在或已失效。'); return; }
  // 前端再驗一次到期（雙保險）
  const exp=d.expiresAt&&d.expiresAt.toMillis?d.expiresAt.toMillis():(d.expiresAt&&d.expiresAt._seconds?d.expiresAt._seconds*1000:0);
  if(exp && Date.now()>exp){ msg('⏰','連結已失效','此分享連結已超過 3 天有效期。'); return; }

  const ov=d.overview||{}, stores=d.stores||[];
  const [yy,mm]=(d.ym||'').split('-');
  const kpi=(l,v,y,color)=>`<div class="kpi"><div class="l">${l}</div><div class="v" ${color?`style="color:${color}"`:''}>${v}</div>${y!=null?`<div class="y">${y}</div>`:''}</div>`;
  const surColor=ov.sur==null?'':(ov.sur>=0?'#137333':'#c5221f');
  const kpis=`<div class="kpis">
    ${kpi('全體營業淨額', '$'+money(ov.net), ov.salesYoY!=null?fmtYoY(ov.salesYoY)+' vs 去年同期':null)}
    ${kpi('全體經營報酬', '$'+money(ov.rew), null)}
    ${kpi('全體門市餘裕（含支援）', ov.sur!=null?'$'+money(ov.sur):'—', null, surColor)}
    ${kpi('平均人事費率', ov.rate!=null?ov.rate.toFixed(1)+'%':'—', null)}
  </div>`;

  const cell=(v,suf,color)=> v==null?'<span style="color:#cbd5e1;">—</span>':`<span ${color?`style="color:${color}"`:''}>${v}${suf||''}</span>`;
  let rows='';
  stores.forEach(r=>{
    rows+=`<tr>
      <td>${esc(r.s)}</td>
      <td>${cell(r.netSales!=null?money(r.netSales):null)}</td>
      <td>${r.salesYoY!=null?fmtYoY(r.salesYoY):'<span style="color:#cbd5e1;">—</span>'}</td>
      <td>${cell(r.grossMargin!=null?r.grossMargin.toFixed(1):null,'%')}</td>
      <td>${cell(r.laborRate!=null?r.laborRate.toFixed(1):null,'%')}</td>
      <td>${cell(r.perHr!=null?money(r.perHr):null)}</td>
      <td>${cell(r.netBad!=null?money(r.netBad):null)}</td>
      <td>${cell(r.invResult!=null?money(r.invResult):null,'',r.invResult<0?'#c5221f':'')}</td>
      <td>${cell(r.surplus!=null?money(r.surplus):null,'',r.surplus!=null?(r.surplus>=0?'#137333':'#c5221f'):'')}</td>
    </tr>`;
  });
  const tbl=`<div class="scroll"><table>
    <thead><tr><th>門市</th><th>營業淨額</th><th>營收YoY</th><th>毛利率</th><th>人事費率</th><th>每工時營收</th><th>淨損耗</th><th>盤損</th><th>門市餘裕</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div style="font-size:10.5px;color:#94a3b8;margin-top:6px;">淨損耗＝壞品＋盤損＋現金短少（含損耗全項）；現金短少正數＝費用；門市餘裕＝經營報酬−含支援調整的人事成本（未扣稅/水電/租金）。</div>`;

  const expStr=exp?new Date(exp).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  document.getElementById('wrap').innerHTML=`
    <div class="head"><h1>📊 ${yy}年${+mm}月 三店營運績效與檢討</h1><div class="sub">加盟主發布・${d.createdByName||''}・資料為產生當下快照</div></div>
    <div class="card"><div class="sec">🏪 三店總覽（含跨店支援調整）</div>${kpis}</div>
    <div class="card"><div class="sec">📋 各店關鍵數據</div>${tbl}</div>
    <div class="card"><div class="sec">📝 營運檢討</div><div class="body">${mdToHtml(d.text||'')}</div></div>
    <div class="foot">此為分享快照，數據為產生當下數值。連結將於 ${expStr} 失效。<br>莉學商行管理系統</div>`;
})();
</script>
</body>
</html>

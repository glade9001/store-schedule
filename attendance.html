<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="莉學商行">
<link rel="apple-touch-icon" href="icon-192.svg">
<meta name="theme-color" content="#e67e22">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🗂️ 出勤管理</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="firebase-init.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--primary:#e67e22;--primary-dark:#c0620f;--accent:#34a853;--danger:#d93025;--warn:#f9ab00;--bg:#f4f6fb;--text:#1e293b;--text-muted:#64748b;--border:#e2e8f0;--header-h:56px;}
html,body{height:100%;background:var(--bg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text);}
#loadingOverlay{display:flex;position:fixed;inset:0;background:linear-gradient(135deg,#e67e22,#c0620f);z-index:99999;flex-direction:column;justify-content:center;align-items:center;color:#fff;transition:opacity .4s;}
#loadingOverlay.hidden{opacity:0;pointer-events:none;}
.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:0 14px;height:var(--header-h);display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;}
.header-back{background:rgba(255,255,255,.18);border:none;color:#fff;height:34px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;padding:0 12px;white-space:nowrap;}
.header-title{font-size:17px;font-weight:800;flex:1;}
.wrap{max-width:640px;margin:0 auto;padding:14px;}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.bar select,.bar input{padding:9px 10px;border:1.5px solid var(--border);border-radius:10px;font-weight:700;font-size:14px;background:#fff;}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);padding:12px 14px;margin-bottom:10px;}
.emp-name{font-size:15px;font-weight:900;margin-bottom:6px;}
.prow{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;border-top:1px dashed #eef1f4;}
.prow:first-of-type{border-top:none;}
.ptag{font-size:11px;font-weight:900;border-radius:6px;padding:2px 7px;white-space:nowrap;}
.tag-in{background:#e6f4ea;color:#137333;}.tag-out{background:#fce8e6;color:#c5221f;}.tag-visit{background:#e3f2fd;color:#1565c0;}
.pstat{margin-left:auto;font-size:12px;font-weight:800;}
.s-ok{color:#137333;}.s-warn{color:#f9ab00;}.s-bad{color:#d93025;}.s-visit{color:#1565c0;}
.meta{font-size:11px;color:var(--text-muted);}
.empty{text-align:center;color:var(--text-muted);padding:40px 12px;}
.maint{text-align:center;padding:40px 20px;}
.sumbar{display:flex;gap:8px;margin-bottom:12px;}
.chip{flex:1;background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.chip-n{font-size:20px;font-weight:900;}.chip-l{font-size:11px;color:var(--text-muted);}
</style>
</head>
<body>
<div id="loadingOverlay"><div class="spinner"></div><div id="loadingText">載入中…</div></div>
<div class="header">
  <button class="header-back" onclick="window.location.href='home.html'">← 首頁</button>
  <div class="header-title">🗂️ 出勤管理</div>
</div>
<div class="wrap" id="wrap"></div>
<!-- 修改／註銷 打卡 modal -->
<div id="editModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;align-items:center;justify-content:center;padding:16px;">
  <div style="background:#fff;border-radius:16px;max-width:420px;width:100%;padding:18px;max-height:90vh;overflow:auto;">
    <div style="font-size:16px;font-weight:900;margin-bottom:4px;">✏️ 修改／註銷打卡</div>
    <div id="editInfo" style="font-size:12.5px;color:#64748b;margin-bottom:12px;line-height:1.6;"></div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <label style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;"><input type="radio" name="editAct" value="edit" checked onchange="editActChange()"> 修改時間</label>
      <label style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;"><input type="radio" name="editAct" value="void" onchange="editActChange()"> 註銷此筆</label>
    </div>
    <div id="editTimeRow" style="margin-bottom:12px;">
      <label style="display:block;font-size:12px;font-weight:700;margin-bottom:5px;">打卡類型（可更正，如夜班誤判上班→改下班）</label>
      <select id="editType" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-weight:700;margin-bottom:10px;">
        <option value="上班">上班</option><option value="下班">下班</option>
      </select>
      <label style="display:block;font-size:12px;font-weight:700;margin-bottom:5px;">更正後時間</label>
      <input type="time" id="editTime" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;font-weight:700;">
      <label style="display:block;font-size:12px;font-weight:700;margin:10px 0 5px;">狀態（可一併更正，如跨日班誤判早退→改正常）</label>
      <select id="editStatus" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-weight:700;">
        <option value="正常">正常</option><option value="遲到">遲到</option><option value="早退">早退</option>
        <option value="警告">警告（遲到容許內）</option><option value="到場">到場</option><option value="缺卡">缺卡</option>
      </select>
    </div>
    <div style="font-size:12px;font-weight:700;margin-bottom:6px;">原因（必填，法規要求留存備查）</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;">
      <button type="button" onclick="pickReason('代為補登')" style="background:#f1f5f9;border:none;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;">代為補登</button>
      <button type="button" onclick="pickReason('忘記打卡')" style="background:#f1f5f9;border:none;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;">忘記打卡</button>
      <button type="button" onclick="pickReason('打卡時間錯誤')" style="background:#f1f5f9;border:none;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;">打卡時間錯誤</button>
      <button type="button" onclick="pickReason('裝置/定位問題')" style="background:#f1f5f9;border:none;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;">裝置/定位問題</button>
    </div>
    <input type="text" id="editReason" placeholder="輸入或點選上方原因" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-weight:600;">
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button onclick="closeEditPunch()" style="flex:1;padding:11px;background:#f1f3f4;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;">取消</button>
      <button id="editApplyBtn" onclick="applyEditPunch()" style="flex:1;padding:11px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;">確認修改</button>
    </div>
    <div style="font-size:11px;color:#94a3b8;margin-top:10px;line-height:1.5;">⚖️ 依勞基法，打卡紀錄不可直接刪除。修改／註銷皆保留原始時間並記錄操作者、原因與時間備查。</div>
  </div>
</div>
<script>
let currentUser=null, appConfig={}, curStore='', curDate='', viewMode='day', curEmp='', storeEmps=[], STORES=[], dispMap={};
const isAdminOwner=()=>['owner','admin'].includes(currentUser?.permission);
function showLoading(t){document.getElementById('loadingText').textContent=t||'載入中…';document.getElementById('loadingOverlay').classList.remove('hidden');}
function hideLoading(){document.getElementById('loadingOverlay').classList.add('hidden');}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmtT(iso){ if(!iso)return''; const d=new Date(iso); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function canClock(stage,perm){ if(stage==='all')return true; if(stage==='manager')return['manager','owner','admin'].includes(perm); if(stage==='admin')return perm==='admin'; return false; }

window.onload=async()=>{
  showLoading('驗證登入…');
  const saved=localStorage.getItem('currentUser')||sessionStorage.getItem('currentUser');
  if(!saved){location.replace('home.html');return;}
  try{currentUser=JSON.parse(saved);}catch(e){location.replace('home.html');return;}
  const fb=await new Promise(r=>{const u=firebase.auth().onAuthStateChanged(x=>{u();r(x);});});
  if(!fb){localStorage.removeItem('currentUser');location.replace('home.html');return;}
  if(!['manager','owner','admin'].includes(currentUser.permission)){ document.getElementById('wrap').innerHTML='<div class="card maint">僅店長以上可用</div>'; hideLoading(); return; }
  try{const s=await window.db.collection('settings').doc('globalConfig').get();if(s.exists)appConfig=s.data();}catch(e){}
  // app 顯示名權威對照（account.empName → displayName）；打卡紀錄自帶的 displayName 可能為舊值或缺漏
  try{const acc=await window.db.collection('account').get();acc.forEach(d=>{const a=d.data();if(a.empName&&a.displayName)dispMap[a.empName]=a.displayName;});}catch(e){}
  const stage=(appConfig.clockIn||{}).stage||'off';
  if(!canClock(stage,currentUser.permission)){
    document.getElementById('wrap').innerHTML='<div class="card maint"><div style="font-size:52px;margin-bottom:14px;">🚧</div><div style="font-size:20px;font-weight:900;margin-bottom:8px;">維護中敬請期待</div><div style="color:var(--text-muted);">出勤管理尚未對您開放。</div></div>';
    hideLoading(); return;
  }
  curDate=todayStr();
  STORES=(appConfig.stores||[]).filter(s=>s!=='人力支援');
  curStore = isAdminOwner()? (STORES[0]||currentUser.store||'') : (currentUser.store||'');
  renderBar();
  await load();
  hideLoading();
};

function renderBar(){
  const storeSel = isAdminOwner()
    ? `<select id="storeSel" onchange="curStore=this.value;storeEmps=[];curEmp='';load();">${STORES.map(s=>`<option value="${s}"${s===curStore?' selected':''}>${s}</option>`).join('')}</select>`
    : `<span style="padding:9px 10px;font-weight:800;">${curStore}</span>`;
  const dateCtrl = viewMode==='day'
    ? `<input type="date" id="dateSel" value="${curDate}" onchange="curDate=this.value;load();">`
    : `<input type="month" id="monthSel" value="${curDate.slice(0,7)}" onchange="curDate=this.value+'-01';load();">`;
  const empOpts = storeEmps.length
    ? storeEmps.map(e=>`<option value="${e.name}"${e.name===curEmp?' selected':''}>${e.dn}</option>`).join('')
    : `<option>${curEmp||'（載入中）'}</option>`;
  const empCtrl = viewMode==='emp' ? `<select id="empSel" onchange="curEmp=this.value;load();">${empOpts}</select>` : '';
  const mbtn=(m,l)=>`<button onclick="setMode('${m}')" style="flex:1;padding:8px 4px;border:1.5px solid ${viewMode===m?'var(--primary)':'var(--border)'};background:${viewMode===m?'var(--primary)':'#fff'};color:${viewMode===m?'#fff':'var(--text)'};border-radius:9px;font-size:12.5px;font-weight:800;cursor:pointer;">${l}</button>`;
  const tolVal = tolOf(curStore);
  const stage=(appConfig.clockIn||{}).stage||'off';
  const enOn = ((appConfig.clockIn||{}).enabledByStore||{})[curStore]===true;
  // 單店打卡開關：僅在全域「全面開放(all)」時才出現，由店長決定本店是否啟用
  const enableToggle = (viewMode==='day' && stage==='all') ? `
  <label style="display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:13px;cursor:pointer;flex-wrap:wrap;background:#f0f9ff;border:1.5px solid #bae6fd;border-radius:10px;padding:10px 12px;">
    <input type="checkbox" id="clockEnChk" ${enOn?'checked':''} onchange="saveClockEnabled(this.checked)" style="width:18px;height:18px;">
    <span style="font-weight:800;">✅ 開啟本店打卡功能</span>
    <span style="color:var(--muted);">（未開啟時，本店員工的打卡與出勤入口顯示「尚未開放」）</span>
  </label>` : '';
  const settings = viewMode==='day' ? `
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;flex-wrap:wrap;">
    <span style="font-weight:800;">⏱️ 遲到容許值</span>
    <input type="number" id="tolInput" min="0" max="60" value="${tolVal}" style="width:66px;padding:8px;border:1.5px solid var(--border);border-radius:8px;font-weight:700;">
    <span>分（含以內顯示警告但算正常）</span>
    <button onclick="saveTol()" style="background:var(--primary);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-weight:800;font-size:12px;cursor:pointer;">儲存</button>
  </div>
  <label style="display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:13px;cursor:pointer;flex-wrap:wrap;">
    <input type="checkbox" id="notifyChk" ${notifyOf(curStore)?'checked':''} onchange="saveNotify(this.checked)" style="width:18px;height:18px;">
    <span style="font-weight:800;">🔔 打卡通知</span>
    <span style="color:var(--muted);">（關閉後不發異常／缺卡通知；員工自發打卡仍會收到成功回執，打卡功能照常）</span>
  </label>` : '';
  document.getElementById('wrap').innerHTML = `<div class="bar">
    ${storeSel}${dateCtrl}${empCtrl}
  </div>
  <div style="display:flex;gap:6px;margin-bottom:12px;">${mbtn('day','📅 單日')}${mbtn('month','⚠️ 本月異常')}${mbtn('emp','👤 員工月表')}</div>
  ${enableToggle}${settings}
  <div id="reqs"></div><div id="sum"></div><div id="list"><div class="empty">載入中…</div></div>`;
}
async function setMode(m){
  viewMode=m;
  if(m==='emp'){ if(!storeEmps.length) await loadStoreEmps(); if(!curEmp) curEmp=(storeEmps[0]&&storeEmps[0].name)||''; }
  renderBar(); load();
}
async function loadStoreEmps(){
  try{ const s=await window.db.collection('stores').doc(curStore).collection('employees').get();
    storeEmps=[]; s.forEach(d=>{ const e=d.data()||{}; if(e.status!=='離職'&&e.status!=='調走') storeEmps.push({name:d.id, dn:dispMap[d.id]||e.displayName||d.id}); });
    storeEmps.sort((a,b)=>a.dn.localeCompare(b.dn,'zh-Hant'));
  }catch(e){ storeEmps=[]; }
}
function empDisplay(name){ return dispMap[name] || (storeEmps.find(x=>x.name===name)||{}).dn || name; }

function tolOf(store){ const c=appConfig.clockIn||{}; const t=(c.tolByStore||{})[store]; return t!=null?t:(c.lateToleranceMin!=null?c.lateToleranceMin:10); }
function notifyOf(store){ const c=appConfig.clockIn||{}; return (c.notifyByStore||{})[store]!==false; }
async function saveNotify(on){
  showLoading('儲存中…');
  try{
    await window.db.collection('settings').doc('globalConfig').update({['clockIn.notifyByStore.'+curStore]: !!on});
    appConfig.clockIn=appConfig.clockIn||{}; appConfig.clockIn.notifyByStore=appConfig.clockIn.notifyByStore||{}; appConfig.clockIn.notifyByStore[curStore]=!!on;
    hideLoading(); alert(`✅ 已${on?'開啟':'關閉'}「${curStore}」打卡通知`);
  }catch(e){ hideLoading(); alert('儲存失敗：'+e.message); }
}
async function saveClockEnabled(on){
  showLoading('儲存中…');
  try{
    await window.db.collection('settings').doc('globalConfig').update({['clockIn.enabledByStore.'+curStore]: !!on});
    appConfig.clockIn=appConfig.clockIn||{}; appConfig.clockIn.enabledByStore=appConfig.clockIn.enabledByStore||{}; appConfig.clockIn.enabledByStore[curStore]=!!on;
    hideLoading(); alert(`✅ 已${on?'開啟':'關閉'}「${curStore}」打卡功能${on?'':'（本店員工打卡/出勤入口將顯示維護中）'}`);
  }catch(e){ hideLoading(); alert('儲存失敗：'+e.message); }
}
async function saveTol(){
  const v=parseInt(document.getElementById('tolInput').value);
  if(isNaN(v)||v<0||v>60){ alert('請輸入 0–60 的分鐘數'); return; }
  showLoading('儲存中…');
  try{
    await window.db.collection('settings').doc('globalConfig').update({['clockIn.tolByStore.'+curStore]: v});
    appConfig.clockIn=appConfig.clockIn||{}; appConfig.clockIn.tolByStore=appConfig.clockIn.tolByStore||{}; appConfig.clockIn.tolByStore[curStore]=v;
    hideLoading(); alert(`✅ 已設定「${curStore}」遲到容許值：${v} 分`);
  }catch(e){ hideLoading(); alert('儲存失敗：'+e.message); }
}
async function loadRequests(){
  const box=document.getElementById('reqs'); if(!box) return;
  let reqs=[];
  try{
    const snap=await window.db.collection('stores').doc(curStore).collection('attendanceRequests').where('status','==','pending').get();
    snap.forEach(d=>reqs.push({id:d.id,...d.data()}));
  }catch(e){ return; }
  if(!reqs.length){ box.innerHTML=''; return; }
  box.innerHTML=`<div class="card" style="border:1.5px solid #ffd8a8;background:#fff8ee;"><div style="font-size:14px;font-weight:900;color:#c0620f;margin-bottom:8px;">📝 待審核申請（${reqs.length}）</div>`+
    reqs.map(r=>`<div style="border-top:1px dashed #f0d9b0;padding:8px 0;">
      <div style="font-size:14px;font-weight:800;">${empDisplay(r.empName)}　<span style="color:var(--text-muted);font-weight:600;font-size:13px;">${r.targetDate} ${r.punchType} ${r.requestedTime}</span></div>
      <div class="meta" style="margin:2px 0;">原因：${r.reason||'—'}${r.homeStore&&r.homeStore!==r.atStore?` · 原店 ${r.homeStore}`:''}</div>
      <div style="display:flex;gap:8px;margin-top:6px;">
        <button onclick="approveReq('${r.id}')" style="flex:1;padding:8px;background:#e6f4ea;color:#137333;border:none;border-radius:8px;font-weight:800;cursor:pointer;">✅ 核准</button>
        <button onclick="rejectReq('${r.id}')" style="flex:1;padding:8px;background:#fce8e6;color:#c5221f;border:none;border-radius:8px;font-weight:800;cursor:pointer;">❌ 駁回</button>
      </div></div>`).join('')+`</div>`;
}
async function approveReq(id){
  const ref=window.db.collection('stores').doc(curStore).collection('attendanceRequests').doc(id);
  showLoading('核准中…');
  try{
    const snap=await ref.get(); if(!snap.exists){ hideLoading(); return; }
    const r=snap.data();
    const deviceTs=new Date(`${r.targetDate}T${r.requestedTime}:00`).toISOString();
    // 找同日同類打卡→有則改時間、無則補登
    const att=window.db.collection('stores').doc(curStore).collection('attendance');
    const ex=await att.where('date','==',r.targetDate).where('empName','==',r.empName).get();
    let target=null; ex.forEach(d=>{ if(d.data().type===r.punchType) target=d; });
    const base={ empName:r.empName, displayName:r.displayName||r.empName, date:r.targetDate, type:r.punchType,
      atStore:curStore, homeStore:r.homeStore||curStore, status:'補登', source:'manual', deviceTs,
      editedBy:currentUser.empName, editNote:`申請${r.type||'補登/修改'}：${r.reason||''}`, ts:firebase.firestore.FieldValue.serverTimestamp() };
    if(target){ await target.ref.set({ deviceTs, status:'補登', source:'manual', editedBy:currentUser.empName, origTs:target.data().deviceTs||'' }, {merge:true}); }
    else { await att.add(base); }
    await ref.set({ status:'approved', reviewedBy:currentUser.empName, reviewedAt:new Date().toISOString() }, {merge:true});
    hideLoading(); await loadRequests(); await load();
  }catch(e){ hideLoading(); alert('核准失敗：'+e.message); }
}
async function rejectReq(id){
  const note=prompt('駁回原因（會通知員工）：','');
  if(note===null) return;
  showLoading('處理中…');
  try{
    await window.db.collection('stores').doc(curStore).collection('attendanceRequests').doc(id)
      .set({ status:'rejected', reviewNote:note, reviewedBy:currentUser.empName, reviewedAt:new Date().toISOString() }, {merge:true});
    hideLoading(); await loadRequests();
  }catch(e){ hideLoading(); alert('失敗：'+e.message); }
}
async function approveOffline(id){
  if(!confirm('核可這筆離線補傳的打卡？\n（確認手機時間與現場相符）')) return;
  showLoading('核可中…');
  try{
    await window.db.collection('stores').doc(curStore).collection('attendance').doc(id)
      .set({ needReview:false, reviewedBy:(currentUser.empName||''), reviewedAt:new Date().toISOString() }, {merge:true});
    hideLoading(); await load();
  }catch(e){ hideLoading(); alert('核可失敗：'+e.message); }
}
// 修改／註銷（勞基法：不可直接刪除竄改；一律保留原始時間＋強制原因＋editLog 留痕備查）
let _editId=null, _editRec=null;
async function openEditPunch(id){
  const ref=window.db.collection('stores').doc(curStore).collection('attendance').doc(id);
  let snap; try{ snap=await ref.get(); }catch(e){ alert('讀取失敗：'+e.message); return; }
  if(!snap.exists){ alert('找不到這筆紀錄'); return; }
  _editId=id; _editRec=snap.data();
  document.getElementById('editInfo').innerHTML=`${empDisplay(_editRec.empName)}　${_editRec.date}　<b>${_editRec.type}</b>　原打卡時間 <b>${fmtT(_editRec.origTs||_editRec.deviceTs)}</b>`;
  document.querySelector('input[name=editAct][value=edit]').checked=true;
  document.getElementById('editTime').value=fmtT(_editRec.deviceTs);
  document.getElementById('editType').value=(_editRec.type==='下班')?'下班':'上班';
  document.getElementById('editStatus').value=_editRec.status||'正常';
  document.getElementById('editReason').value='';
  editActChange();
  document.getElementById('editModal').style.display='flex';
}
function editActChange(){ const act=document.querySelector('input[name=editAct]:checked').value; document.getElementById('editTimeRow').style.display=act==='edit'?'block':'none'; document.getElementById('editApplyBtn').textContent=act==='void'?'確認註銷':'確認修改'; }
function pickReason(t){ document.getElementById('editReason').value=t; }
function closeEditPunch(){ document.getElementById('editModal').style.display='none'; _editId=null; _editRec=null; }
async function applyEditPunch(){
  const reason=document.getElementById('editReason').value.trim();
  if(!reason){ alert('請填寫修改／註銷原因（法規要求留存備查）'); return; }
  const act=document.querySelector('input[name=editAct]:checked').value;
  const ref=window.db.collection('stores').doc(curStore).collection('attendance').doc(_editId);
  const now=new Date().toISOString(), by=(currentUser.empName||currentUser.displayName||'');
  const AU=firebase.firestore.FieldValue.arrayUnion;
  showLoading('處理中…');
  try{
    if(act==='void'){
      await ref.set({ voided:true, voidReason:reason, voidedBy:by, voidedAt:now,
        editLog:AU({at:now, by, action:'註銷', reason}) }, {merge:true});
    }else{
      const tv=document.getElementById('editTime').value;
      if(!tv){ hideLoading(); alert('請選擇更正後時間'); return; }
      const [hh,mm]=tv.split(':');
      const nd=new Date(`${_editRec.date}T${hh}:${mm}:00+08:00`);
      const orig=_editRec.origTs||_editRec.deviceTs||''; // 首次修改才鎖原始時間，之後保留最初值
      const ns=document.getElementById('editStatus').value;
      const nt=document.getElementById('editType').value;
      const upd={ deviceTs:nd.toISOString(), tsMs:nd.getTime(), origTs:orig, editedBy:by, editReason:reason, editedAt:now, source:'manual',
        editLog:AU({at:now, by, action:'修改', from:`${_editRec.type||''}/${fmtT(_editRec.deviceTs)}/${_editRec.status||''}`, to:`${nt}/${tv}/${ns}`, reason}) };
      if(nt!==_editRec.type){ upd.type=nt; if(!_editRec.origType) upd.origType=_editRec.type||''; }
      if(ns!==_editRec.status){ upd.status=ns; if(!['遲到','早退','警告'].includes(ns)) upd.lateMin=0; if(!_editRec.origStatus) upd.origStatus=_editRec.status||''; }
      await ref.set(upd, {merge:true});
    }
    hideLoading(); closeEditPunch(); await load();
  }catch(e){ hideLoading(); alert('失敗：'+e.message); }
}
const isAnomRec=r=>['遲到','早退','缺卡'].includes(r.status) && !r.voided;
// 單筆打卡列（day/月/員工月表共用；showEmp 時前綴員工名）
function punchRow(r, showEmp){
  const tag=r.type==='上班'?'tag-in':r.type==='下班'?'tag-out':'tag-visit';
  const anom=isAnomRec(r), voided=!!r.voided;
  const sc=anom?'s-bad':r.status==='警告'?'s-warn':r.status==='到場'?'s-visit':'s-ok';
  const st=r.status==='遲到'?`遲到 ${r.lateMin||''} 分`:r.status==='警告'?`遲到 ${r.lateMin||''} 分(容許內)`:r.status==='缺卡'?(r.note||'缺卡'):r.status||'';
  const time=fmtT(r.deviceTs);
  const srcTag = r.origTs?'<span style="font-size:11px;color:#8a5cf6;font-weight:800;">·已修改</span>'
    : r.source==='manual'?'<span style="font-size:11px;color:#8a5cf6;font-weight:800;">·補登</span>'
    : r.source==='offline'?'<span style="font-size:11px;color:#e67e22;font-weight:800;">·📴離線</span>'
    : r.source==='system'?'<span style="font-size:11px;color:#d93025;font-weight:800;">·系統</span>':'';
  const needRev = r.source==='offline' && r.needReview;
  const reviewBtn = needRev?`<button onclick="approveOffline('${r.id}')" title="核可離線打卡" style="background:#e6f4ea;color:#137333;border:none;border-radius:8px;padding:5px 9px;font-weight:800;font-size:11px;cursor:pointer;margin-left:6px;">✔核可</button>`:'';
  const editBtn=`<button onclick="openEditPunch('${r.id}')" title="修改／註銷（需填原因，保留原始紀錄）" style="background:#eef2ff;color:#4338ca;border:none;border-radius:8px;padding:5px 9px;font-weight:800;font-size:11px;cursor:pointer;margin-left:6px;">✏️</button>`;
  const rowStyle=voided?'opacity:.55;text-decoration:line-through;':anom?'border-left:3px solid var(--danger);padding-left:8px;background:#fff5f5;border-radius:6px;':'';
  const empLbl=showEmp?`<span style="font-weight:800;min-width:52px;">${empDisplay(r.empName)}</span>`:'';
  let h=`<div class="prow" style="${rowStyle}">${empLbl}
    <span class="ptag ${tag}">${r.type}</span>
    <span style="font-weight:800;">${time}</span>
    <span class="meta">@${r.atStore}${r.distanceM!=null?` · ${r.distanceM}m`:''}${r.shift?` · 班 ${r.shift}`:''}${r.homeStore&&r.homeStore!==r.atStore?` · 原店 ${r.homeStore}`:''}${srcTag}${voided?' · <span style="color:var(--danger);font-weight:800;">已註銷</span>':''}</span>
    <span class="pstat ${needRev?'s-warn':sc}">${needRev?'離線待核':(anom?'⚠️ '+st:st)}</span>${reviewBtn}${voided?'':editBtn}
  </div>`;
  if(r.note) h+=`<div class="meta" style="padding:0 0 6px 4px;">💬 ${r.note}${r.noteBy?`（${r.noteBy}）`:''}</div>`;
  if(r.editReason||r.voidReason) h+=`<div class="meta" style="padding:0 0 6px 4px;color:#8a5cf6;">✏️ ${voided?'註銷':'修改'}原因：${r.voidReason||r.editReason}${(r.voidedBy||r.editedBy)?`（${r.voidedBy||r.editedBy}）`:''}${(r.origTs&&!voided)?` · 原時間 ${fmtT(r.origTs)}`:''}</div>`;
  if(!voided && r.otStatus){
    if(r.otStatus==='pending') h+=`<div style="padding:2px 0 8px 4px;font-size:12px;color:#c0620f;line-height:1.6;">📝 加班申請待審：<b>${r.otContent||'—'}</b> <button onclick="approveOt('${r.id}')" style="background:#e6f4ea;color:#137333;border:none;border-radius:8px;padding:4px 10px;font-weight:800;font-size:11px;cursor:pointer;margin-left:4px;">✔同意</button><button onclick="rejectOt('${r.id}')" style="background:#fce8e6;color:#c5221f;border:none;border-radius:8px;padding:4px 10px;font-weight:800;font-size:11px;cursor:pointer;margin-left:4px;">✕否</button></div>`;
    else if(r.otStatus==='approved') h+=`<div class="meta" style="padding:0 0 6px 4px;color:#137333;font-weight:700;">✅ 加班已核准（計工時）${r.otContent?'：'+r.otContent:''}</div>`;
    else if(r.otStatus==='rejected') h+=`<div class="meta" style="padding:0 0 6px 4px;color:#94a3b8;">❌ 加班未准${r.otReason?'：'+r.otReason:''}（不計工時）</div>`;
    else if(r.otStatus==='private') h+=`<div class="meta" style="padding:0 0 6px 4px;color:#64748b;">🅿️ 不計工時（非加班／私事）${r.otContent?`・${r.otContent}`:''}</div>`;
  }
  return h;
}
async function approveOt(id){
  if(!confirm('同意這筆加班？\n（會計入有效工時，並請記得到排班表調整班別）')) return;
  showLoading('處理中…');
  try{
    await window.db.collection('stores').doc(curStore).collection('attendance').doc(id)
      .set({ otStatus:'approved', otReviewedBy:(currentUser.empName||''), otReviewedAt:new Date().toISOString() },{merge:true});
    hideLoading(); alert('✅ 已核准加班，請記得到排班表調整班別'); await load();
  }catch(e){ hideLoading(); alert('失敗：'+e.message); }
}
async function rejectOt(id){
  const reason=prompt('未准原因（會存檔，員工可在「我的出勤」看到）：\n例：非必要加班／未事先報備／時段誤打','');
  if(reason===null) return;
  showLoading('處理中…');
  try{
    await window.db.collection('stores').doc(curStore).collection('attendance').doc(id)
      .set({ otStatus:'rejected', otReason:reason, otReviewedBy:(currentUser.empName||''), otReviewedAt:new Date().toISOString() },{merge:true});
    hideLoading(); await load();
  }catch(e){ hideLoading(); alert('失敗：'+e.message); }
}
// 有效工時：以排班時數為基準(超時封頂)、核准加班才加、到場/私事不計；跨日自動接續
function schedHours(sh){ const m=String(sh||'').match(/^(\d{1,2})-(\d{1,2})$/); if(!m)return 0; let a=+m[1],b=+m[2]; if(b<=a)b+=24; return b-a; }
function calcHours(recs){
  const pts=recs.filter(r=>(r.type==='上班'||r.type==='下班') && r.status!=='缺卡' && !r.voided)
    .map(r=>({type:r.type,t:(typeof r.tsMs==='number'?r.tsMs:Date.parse(r.deviceTs||r.date||'')),shift:r.shift||'',ot:r.otStatus||null}))
    .filter(r=>isFinite(r.t)).sort((a,b)=>a.t-b.t);
  let hours=0,open=null;
  pts.forEach(p=>{
    if(p.type==='上班')open=p;
    else if(open){
      const actual=(p.t-open.t)/3600000;
      if(actual>0){ const otA=open.ot==='approved'||p.ot==='approved'; const sc=schedHours(open.shift||p.shift); hours+= sc>0?(otA?actual:Math.min(actual,sc)):(otA?actual:0); }
      open=null;
    }
  });
  return hours;
}
function dayHdr(dt){ const [y,m,d]=dt.split('-'); const wd=['日','一','二','三','四','五','六'][new Date(+y,+m-1,+d).getDay()]; return `${+m}/${+d}（${wd}）`; }
function addDays(ds,n){ const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
const gd=r=>r.shiftDate||r.date; // 歸班日（跨日夜班下班歸到上班那天）
async function fetchMonth(){ // 讀當月整店打卡（多讀次月1號以接住月底夜班的隔日下班）
  const ym=curDate.slice(0,7); const [y,m]=ym.split('-').map(Number);
  const nextFirst=`${m===12?y+1:y}-${String(m===12?1:m+1).padStart(2,'0')}-01`;
  const snap=await window.db.collection('stores').doc(curStore).collection('attendance').where('date','>=',ym+'-01').where('date','<=',nextFirst).get();
  const recs=[]; snap.forEach(d=>recs.push({id:d.id,...d.data()})); return recs;
}
async function load(){
  loadRequests();
  const tolEl=document.getElementById('tolInput'); if(tolEl) tolEl.value=tolOf(curStore);
  const nfEl=document.getElementById('notifyChk'); if(nfEl) nfEl.checked=notifyOf(curStore);
  const enEl=document.getElementById('clockEnChk'); if(enEl) enEl.checked=(((appConfig.clockIn||{}).enabledByStore||{})[curStore]===true);
  if(viewMode==='month') return loadMonth();
  if(viewMode==='emp') return loadEmp();
  return loadDay();
}
async function loadDay(){
  const list=document.getElementById('list'); if(list) list.innerHTML='<div class="empty">載入中…</div>';
  let recs=[];
  try{ // 讀當天+隔天，依歸班日(shiftDate)過濾，讓跨日夜班整段顯示在開始日
    const snap=await window.db.collection('stores').doc(curStore).collection('attendance').where('date','>=',curDate).where('date','<=',addDays(curDate,1)).get();
    snap.forEach(d=>{ const r={id:d.id,...d.data()}; if(gd(r)===curDate) recs.push(r); });
  }catch(e){ if(list) list.innerHTML=`<div class="empty">讀取失敗：${e.message}</div>`; return; }
  recs.sort((a,b)=>(a.deviceTs||'').localeCompare(b.deviceTs||''));
  const anomalies=recs.filter(isAnomRec).length, visits=recs.filter(r=>r.status==='到場').length, emps=[...new Set(recs.map(r=>r.empName))];
  document.getElementById('sum').innerHTML=`<div class="sumbar">
    <div class="chip"><div class="chip-n">${emps.length}</div><div class="chip-l">有打卡人數</div></div>
    <div class="chip"><div class="chip-n" style="color:${anomalies?'var(--danger)':'var(--text)'}">${anomalies}</div><div class="chip-l">遲到/早退/缺卡</div></div>
    <div class="chip"><div class="chip-n" style="color:${visits?'var(--primary)':'var(--text)'}">${visits}</div><div class="chip-l">到場記錄</div></div>
  </div>`;
  if(!recs.length){ if(list) list.innerHTML='<div class="empty">這天尚無打卡記錄</div>'; return; }
  const byEmp={}; recs.forEach(r=>{ (byEmp[r.empName]=byEmp[r.empName]||[]).push(r); });
  let html='';
  Object.entries(byEmp).forEach(([emp,list2])=>{
    const dn=empDisplay(emp); const anomCnt=list2.filter(isAnomRec).length;
    const anomChip=anomCnt?` <span style="background:var(--danger);color:#fff;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:800;">⚠️ ${anomCnt} 筆異常</span>`:'';
    html+=`<div class="card"><div class="emp-name">${dn}${anomChip}</div>`;
    list2.forEach(r=>{ html+=punchRow(r,false); });
    html+=`</div>`;
  });
  if(list) list.innerHTML=html;
}
async function loadMonth(){
  const list=document.getElementById('list'); list.innerHTML='<div class="empty">載入中…</div>';
  const ym=curDate.slice(0,7);
  let recs=[]; try{ recs=(await fetchMonth()).filter(r=>String(gd(r)).startsWith(ym)); }catch(e){ list.innerHTML=`<div class="empty">讀取失敗：${e.message}</div>`; return; }
  const anoms=recs.filter(r=>isAnomRec(r) || (r.source==='offline'&&r.needReview&&!r.voided) || (r.otStatus==='pending'&&!r.voided)).sort((a,b)=>(gd(a)+(a.deviceTs||'')).localeCompare(gd(b)+(b.deviceTs||'')));
  const cnt=t=>anoms.filter(r=>r.status===t).length;
  document.getElementById('sum').innerHTML=`<div class="sumbar">
    <div class="chip"><div class="chip-n" style="color:${anoms.length?'var(--danger)':'var(--text)'}">${anoms.length}</div><div class="chip-l">本月待處理</div></div>
    <div class="chip"><div class="chip-n">${cnt('遲到')}</div><div class="chip-l">遲到</div></div>
    <div class="chip"><div class="chip-n">${cnt('早退')}</div><div class="chip-l">早退</div></div>
    <div class="chip"><div class="chip-n">${cnt('缺卡')}</div><div class="chip-l">缺卡</div></div>
  </div>`;
  if(!anoms.length){ list.innerHTML='<div class="empty">🎉 本月無待處理異常</div>'; return; }
  const byDate={}; anoms.forEach(r=>{ const k=gd(r); (byDate[k]=byDate[k]||[]).push(r); });
  let html='';
  Object.keys(byDate).sort().forEach(dt=>{
    html+=`<div class="card"><div class="emp-name">${dayHdr(dt)}</div>`;
    byDate[dt].sort((a,b)=>(a.deviceTs||'').localeCompare(b.deviceTs||'')).forEach(r=>{ html+=punchRow(r,true); });
    html+=`</div>`;
  });
  list.innerHTML=html;
}
async function loadEmp(){
  const list=document.getElementById('list');
  if(!curEmp){ document.getElementById('sum').innerHTML=''; list.innerHTML='<div class="empty">請選擇員工</div>'; return; }
  list.innerHTML='<div class="empty">載入中…</div>';
  const ym=curDate.slice(0,7);
  let all=[]; try{ all=await fetchMonth(); }catch(e){ list.innerHTML=`<div class="empty">讀取失敗：${e.message}</div>`; return; }
  const recs=all.filter(r=>r.empName===curEmp && String(gd(r)).startsWith(ym));
  const hours=calcHours(recs), anom=recs.filter(isAnomRec).length;
  document.getElementById('sum').innerHTML=`<div class="sumbar">
    <div class="chip"><div class="chip-n" style="color:#137333">${hours.toFixed(1)}</div><div class="chip-l">本月有效工時(h)</div></div>
    <div class="chip"><div class="chip-n" style="color:${anom?'var(--danger)':'var(--text)'}">${anom}</div><div class="chip-l">異常筆數</div></div>
  </div>`;
  if(!recs.length){ list.innerHTML='<div class="empty">本月無打卡記錄</div>'; return; }
  const byDate={}; recs.forEach(r=>{ const k=gd(r); (byDate[k]=byDate[k]||[]).push(r); });
  let html='';
  Object.keys(byDate).sort().forEach(dt=>{
    html+=`<div class="card"><div class="emp-name">${dayHdr(dt)}</div>`;
    byDate[dt].sort((a,b)=>(a.deviceTs||'').localeCompare(b.deviceTs||'')).forEach(r=>{ html+=punchRow(r,false); });
    html+=`</div>`;
  });
  list.innerHTML=html;
}
</script>

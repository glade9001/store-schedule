<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0e2140">
<title>莉學團購</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>
<script src="firebase-init.js"></script>
<script src="gb-common.js?v=20261010f"></script>
<link rel="stylesheet" href="groupbuy.css?v=20261010f">
<style>
/* 客人端（LIFF）：比後台更大的字與按鈕 */
.lf-hero{background:#0e2140;color:#fff;padding:14px 16px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent;}   /* cursor:pointer：iPhone 才會對它觸發 click（連點 5 下開分享測試） */
.lf-hero b{font-size:18px;}
.lf-hero small{display:block;opacity:.8;font-size:12.5px;margin-top:2px;}
.lf-card{background:#fff;border-radius:16px;box-shadow:0 1px 5px rgba(0,0,0,.07);overflow:hidden;margin-bottom:14px;}
.lf-img{display:block;width:100%;height:auto;max-width:100%;background:#eef2f7;}   /* 依原圖比例完整顯示，不裁切 */
/* 列表：一行兩格（2026-10-11） */
.lf-share{width:100%;border:none;border-radius:12px;padding:12px;margin-bottom:10px;font-size:15px;font-weight:900;background:#0e2140;color:#fff;cursor:pointer;font-family:inherit;}
.lf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.lf-tile{display:flex;flex-direction:column;text-align:left;background:#fff;border:none;border-radius:14px;box-shadow:0 1px 5px rgba(0,0,0,.07);overflow:hidden;padding:0;cursor:pointer;font-family:inherit;color:inherit;min-width:0;}
.lf-tile-img{position:relative;width:100%;aspect-ratio:1/1;background:#f1f5f9;display:flex;align-items:center;justify-content:center;}
.lf-tile-img img{width:100%;height:100%;object-fit:cover;}   /* 列表縮圖填滿方格（裁切沒關係，使用者 2026-10-11）；詳細頁才看完整圖 */
.lf-tile-img span{font-size:40px;}
.lf-tile-mine,.lf-tile-sold{position:absolute;left:6px;top:6px;font-style:normal;font-size:11.5px;font-weight:800;border-radius:7px;padding:2px 7px;}
.lf-tile-mine{background:#e6f4ea;color:#137333;}
.lf-tile-sold{background:#475569;color:#fff;left:auto;right:6px;}
.lf-tile-t{font-size:14.5px;font-weight:800;line-height:1.35;padding:8px 10px 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.lf-tile-p{font-size:15px;font-weight:900;color:#c5221f;padding:0 10px 2px;margin-top:auto;}
.lf-tile-h{font-size:12px;font-weight:700;color:#c2410c;padding:0 10px 10px;line-height:1.4;}
/* 詳細頁：蓋在列表上（數量、手機視窗 z-index 100 在它上面） */
#lfDetail{position:fixed;inset:0;z-index:60;background:var(--bg,#f4f6fa);overflow-y:auto;-webkit-overflow-scrolling:touch;}
.lf-detail-bar{position:sticky;top:0;z-index:2;background:#0e2140;color:#fff;padding:10px 12px;}
.lf-detail-bar button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;}
.lf-body{padding:13px 14px 14px;}
.lf-title{font-size:18px;font-weight:900;line-height:1.35;}
.lf-price{font-size:20px;font-weight:900;color:#c5221f;margin:4px 0 2px;}
.lf-desc{font-size:13.5px;color:#475569;line-height:1.65;white-space:pre-wrap;margin:6px 0;}
.lf-meta{font-size:13px;color:var(--muted);line-height:1.7;}
.lf-go{width:100%;border:none;border-radius:12px;padding:14px;font-size:17px;font-weight:900;background:#06c755;color:#fff;margin-top:10px;cursor:pointer;font-family:inherit;}
.lf-go:disabled{background:#cbd5e1;color:#fff;}
.lf-mine{background:#e6f4ea;color:#137333;border-radius:10px;padding:8px 11px;font-size:14px;font-weight:800;margin-top:8px;}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0 6px;}
.stepper button{width:54px;height:54px;border-radius:50%;border:2px solid var(--border);background:#fff;font-size:26px;font-weight:900;cursor:pointer;}
.stepper b{font-size:34px;min-width:60px;text-align:center;font-variant-numeric:tabular-nums;}
.lf-opt{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #eef2f7;}
.lf-opt-t{flex:1;min-width:0;font-size:15.5px;line-height:1.5;}
.lf-opt-t small{display:block;font-size:12px;color:var(--muted);}
.lf-opt-p{color:#c5221f;font-weight:900;}
.lf-opt-mine{display:inline-block;background:#e6f4ea;color:#137333;border-radius:7px;padding:0 7px;font-size:12.5px;font-weight:800;margin-left:4px;}
.lf-go.lf-go-s{width:auto;flex:none;margin:0;padding:10px 16px;font-size:15px;min-width:82px;}
.lf-foot{font-size:11.5px;color:#94a3b8;text-align:center;line-height:1.7;padding:10px 6px 30px;}
</style>
</head>
<body>
<div id="loadingOverlay"><div class="spinner"></div><div id="loadingText">載入中…</div></div>
<div class="lf-hero"><b id="lfStoreName">莉學團購</b><small id="lfHello">7-ELEVEN 美德・聯鑫・錦花</small></div>
<div class="wrap" style="padding-top:12px;">
  <div class="gb-tabs" role="tablist">
    <button role="tab" id="lfTabList" class="on" aria-selected="true" onclick="lfSetTab('list')">🛒 團購商品</button>
    <button role="tab" id="lfTabMine" aria-selected="false" onclick="lfSetTab('mine')">📋 我的訂單</button>
  </div>
  <div id="lfList"></div>
  <div id="lfMine" hidden></div>
  <div id="lfDetail" hidden><div class="lf-detail-bar"><button onclick="lfCloseDetail()">← 返回商品列表</button></div><div class="wrap" style="padding-top:12px;" id="lfDetailBody"></div></div>
  <div class="lf-foot">本服務由莉學商行經營，僅限美德・聯鑫・錦花三家門市。資料只用於團購訂單、取貨與聯絡，<a href="gb-privacy.html">隱私權政策</a>・<a href="gb-terms.html">服務條款</a><br>到店取貨付款。<br><span style="opacity:.6;">版本 20261010f</span></div>
</div>

<!-- 手機（第一次下單前）-->
<div class="modal" id="phoneModal" hidden>
  <form class="sheet" onsubmit="event.preventDefault();lfSavePhone();">
    <h3>留個手機號碼</h3>
    <p class="lead">到貨時或逾期沒來取貨時，門市會用這支電話聯絡你。只在莉學商行三家門市內部使用，不會拿來行銷。</p>
    <div class="f"><span>手機號碼</span><input id="pmPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0912345678" maxlength="12" required></div>
    <div class="err" id="pmErr"></div>
    <div class="sheet-btns">
      <button type="button" class="btn btn-g" onclick="document.getElementById('phoneModal').hidden=true">取消</button>
      <button type="submit" class="btn btn-p" id="pmOk" style="background:#06c755;">儲存</button>
    </div>
  </form>
</div>

<!-- 選數量 -->
<div class="modal" id="qtyModal" hidden>
  <div class="sheet">
    <h3 id="qmTitle">選擇數量</h3>
    <p class="lead" id="qmLead"></p>
    <div class="stepper"><button type="button" onclick="lfStep(-1)" aria-label="減少">−</button><b id="qmQty">1</b><button type="button" onclick="lfStep(1)" aria-label="增加">＋</button></div>
    <div class="err" id="qmErr" style="text-align:center;"></div>
    <div class="sheet-btns">
      <button type="button" class="btn btn-g" onclick="document.getElementById('qtyModal').hidden=true">取消</button>
      <button type="button" class="btn btn-p" id="qmOk" style="background:#06c755;" onclick="lfConfirm()">確定</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<!-- ?v＝版本號：LIFF 在 GitHub Pages（快取 10 分鐘），改了 JS／CSS 要一起改版本號，客人才會拿到新版 -->
<script src="liff-page.js?v=20261010f"></script>
</body>
</html>

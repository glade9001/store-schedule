<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html,body{width:2500px;height:843px;overflow:hidden;font-family:"PingFang TC","Heiti TC",sans-serif;background:#fff}
.row{display:flex;height:843px}
.c{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;position:relative}
.c1{width:833px;background:#19a24a;color:#fff}
.c2{width:834px;background:#f57c1f;color:#fff}
.c3{width:833px;background:#fdf0e1;color:#0e2140}
.c2:before,.c3:before{content:"";position:absolute;left:0;top:90px;bottom:90px;width:6px;background:rgba(255,255,255,.55)}
.ic{width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:170px;line-height:1}
.c3 .ic{background:#fff}
.av{width:320px;height:320px;border-radius:50%;background:url(avatar.png) center/cover;border:10px solid #fff}
.t{font-size:120px;font-weight:900;letter-spacing:8px}
.s{font-size:54px;font-weight:600;opacity:.9;margin-top:-20px}
</style></head><body><div class="row">
<div class="c c1"><div class="av"></div><div class="t">我要下單</div><div class="s">看開放中的團購</div></div>
<div class="c c2"><div class="ic">📋</div><div class="t">我的訂單</div><div class="s">改數量・取消</div></div>
<div class="c c3"><div class="ic">❓</div><div class="t">怎麼團購</div><div class="s">下單・取貨說明</div></div>
</div></body></html>
